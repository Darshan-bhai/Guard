/* Layout: single phone-width column, sticky executive header, fixed 5-tab bar. Dark-only by design. */
[hidden] { display: none !important; }
:root {
  --obsidian: #050911; --navy: #0B1324; --card: #101B33; --card-2: #16244A; --line: #26304A; --line-2: #2B3247;

  --ok: #10B981; --info: #38BDF8; --warn: #F59E0B; --danger: #F43F5E; --owed: #E9C46A;
  --text: #F8FAFC; --muted: #94A3B8; --faint: #64748B;

  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-num: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--obsidian); }
body {
  margin: 0; color: var(--text); font: 15px/1.45 var(--f-body);
  background: radial-gradient(circle at 50% 0%, #132242 0%, #070D19 55%, #04070F 100%) fixed, var(--obsidian);
  -webkit-tap-highlight-color: transparent; min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: #070D19; }
button, input, select, textarea { font: inherit; color: inherit; }

a { color: var(--gold-light); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 12.5px; } .tiny { font-size: 11px; }
.gold-text { background: linear-gradient(135deg, #FFF3C4 0%, #D4AF37 50%, #F59E0B 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--gold); }

.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(7, 13, 25, .94); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, .18); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.emblem { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, #162444 0%, #0A1326 60%, #191712 100%); border: 1px solid rgba(212, 175, 55, .5); }
.brand { min-width: 0; flex: 1; }

.top .actions { display: flex; gap: 6px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line-2); background: var(--card); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--text); }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.card.gold { background: linear-gradient(135deg, #162444 0%, #0A1326 60%, #191712 100%); border-color: rgba(212, 175, 55, .48);
  box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .75), 0 0 25px -8px rgba(212, 175, 55, .18), inset 0 1px 0 rgba(243, 229, 171, .18); }
.card.flat { background: var(--card); box-shadow: none; border-color: var(--line-2); }
main { padding-block: 14px 110px; display: flex; flex-direction: column; gap: 14px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 2px -4px; }
.sec-title h2 { margin: 0; font: 700 15px/1.2 var(--f-display); letter-spacing: .05em; color: var(--gold-light); }
.label { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: .03em; white-space: nowrap;
  border: 1px solid currentColor; background: color-mix(in srgb, currentColor 14%, transparent); }
.c-ok { color: var(--ok); } .c-info { color: var(--info); } .c-warn { color: var(--warn); } .c-danger { color: var(--danger); } .c-owed { color: var(--owed); } .c-muted { color: var(--muted); } .c-gold { color: var(--gold); }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border-radius: 6px; background: var(--card-2); color: var(--gold-light); border: 1px solid var(--line-2); }

/* alerts */
.alerts { display: flex; flex-direction: column; gap: 8px; }

.alert.danger { border-color: rgba(244, 63, 94, .5); background: rgba(244, 63, 94, .1); }
.alert.warn { border-color: rgba(245, 158, 11, .5); background: rgba(245, 158, 11, .1); }
.alert.info { border-color: rgba(56, 189, 248, .45); background: rgba(56, 189, 248, .08); }
.alert.muted { border-color: var(--line-2); background: var(--card); }
.alert.demo { border-color: rgba(212, 175, 55, .55); background: rgba(212, 175, 55, .08); }

/* hero */
.hero h3 { margin: 4px 0 2px; font-size: 18px; }
.hero .when { font-size: 13px; color: var(--gold-light); }
.hero .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.hero .acts .btn { padding: 0 6px; font-size: 13px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { padding: 12px; cursor: default; }
.kpi .val { font: 700 21px/1.2 var(--f-num); margin: 6px 0 2px; }
.kpi .val.txt { font-family: var(--f-body); font-size: 17px; }
.kpi .foot { font-size: 11.5px; color: var(--muted); }
.kpi.click { cursor: pointer; }

/* charts */
.chart-card svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; min-height: 32px; }
.seg button.on { background: rgba(212, 175, 55, .16); color: #FCD34D; }

/* filters */
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line-2); background: var(--card); color: var(--muted); border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 36px; }
.chip.on { border-color: rgba(212, 175, 55, .6); background: rgba(212, 175, 55, .14); color: #FCD34D; }
.search { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); padding: 0 14px; }

/* shift cards */
.week-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 2px 0; }
.shift { display: flex; flex-direction: column; gap: 8px; padding: 13px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line-2); }
.shift.is-danger { border-color: rgba(244, 63, 94, .55); }
.shift.is-warn { border-color: rgba(245, 158, 11, .5); }
.shift .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.shift .head .grow { min-width: 0; }
.shift .site { font-weight: 700; font-size: 15.5px; margin: 3px 0 1px; overflow-wrap: anywhere; }
.shift .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.shift .money { font: 700 17px/1 var(--f-num); color: var(--gold-light); }
.bar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, #10B981, #FBBF24); border-radius: 6px; }
.warnbox { font-size: 12.5px; padding: 8px 10px; border-radius: 9px; border: 1px solid; }
.warnbox.danger { color: #FDA4AF; border-color: rgba(244, 63, 94, .45); background: rgba(244, 63, 94, .08); }
.warnbox.warn { color: #FCD34D; border-color: rgba(245, 158, 11, .45); background: rgba(245, 158, 11, .08); }
.warnbox.ok { color: #6EE7B7; border-color: rgba(16, 185, 129, .4); background: rgba(16, 185, 129, .07); }
.shift .acts { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.shift .acts .btn { flex: 1 1 auto; }

.empty .big { font: 700 16px/1.3 var(--f-display); color: var(--gold-light); margin-bottom: 6px; letter-spacing: .04em; }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 44px; border-radius: 11px; border: 1px solid var(--line-2); background: #0D1528; padding: 8px 12px; }
.field textarea { min-height: 130px; font-family: var(--f-num); font-size: 14px; line-height: 1.5; resize: vertical; }
.field.ok input, .field.ok select { border-color: rgba(16, 185, 129, .45); }

.form { display: flex; flex-direction: column; gap: 12px; }
.readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; border-radius: 12px; background: rgba(212, 175, 55, .07); border: 1px solid rgba(212, 175, 55, .3); }
.readout div { min-width: 0; } .readout b { display: block; font: 700 15px var(--f-num); color: var(--gold-light); }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check-row input { width: 22px; height: 22px; accent-color: var(--gold); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.switch:last-child { border-bottom: 0; }
.switch input[type=checkbox] { width: 46px; height: 26px; appearance: none; border-radius: 99px; background: #334155; position: relative; cursor: pointer; flex: none; transition: background .15s; }

.switch input[type=checkbox]:checked { background: var(--gold); }
.switch input[type=checkbox]:checked::after { left: 23px; }

/* scan */
.method { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.method button { min-height: 74px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--card); color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; }
.method button.on { border-color: var(--gold); background: rgba(212, 175, 55, .1); color: #FCD34D; }
.progress { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--gold); width: 0; transition: width .2s; }
.review { border: 1px solid rgba(212, 175, 55, .35); }
.review-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dh { font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 1px solid transparent; background: transparent; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 14px var(--f-num); color: var(--text); padding: 0; min-height: 38px; }
.cal button.out { color: var(--faint); }
.cal button.today { border-color: var(--gold); }
.cal button.sel { background: rgba(212, 175, 55, .18); }
.cal .dots { display: flex; gap: 2px; height: 5px; }
.cal .dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }

/* lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 600; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 104px; color: var(--text); }
.tile b { font: 700 15px var(--f-display); letter-spacing: .04em; color: var(--gold-light); }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(7, 13, 25, .96); backdrop-filter: blur(10px); border-top: 1px solid rgba(245, 158, 11, .28);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding-block: 6px; }
.nav button { border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 12px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer; }
.nav button.on { background: rgba(245, 158, 11, .14); border-color: rgba(245, 158, 11, .32); color: #FCD34D; font-weight: 800; }
.nav svg { width: 22px; height: 22px; }
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); z-index: 31; width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255, 243, 196, .5);
  background: linear-gradient(135deg, #E5C158, #A37B16); color: #050911; font-size: 30px; font-weight: 400; cursor: pointer; box-shadow: 0 10px 26px rgba(0, 0, 0, .5), 0 0 20px rgba(212, 175, 55, .3); display: grid; place-items: center; }
@media (min-width: 700px) { .fab { right: calc(50% - 300px); } }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(2, 5, 12, .72); display: flex; align-items: flex-end; justify-content: center; }
.modal { width: 100%; max-width: 620px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: #0A1224; border: 1px solid rgba(212, 175, 55, .35); border-bottom: 0;
  border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 700px) { .modal-back { align-items: center; } .modal { border-radius: 20px; border-bottom: 1px solid rgba(212, 175, 55, .35); } }
.modal h3 { margin: 0 0 12px; font: 700 18px/1.25 var(--f-display); letter-spacing: .04em; color: var(--gold-light); }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sticky-actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: #0A1224; padding-block: 12px; margin-top: 4px; display: flex; gap: 8px; }
.sticky-actions .btn { flex: 1; }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 60; background: #1B2744; border: 1px solid rgba(212, 175, 55, .45);
  color: var(--text); padding: 10px 14px; border-radius: 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 12px 30px rgba(0, 0, 0, .5); max-width: calc(100% - 32px); font-size: 14px; }
.toast button { background: none; border: 0; color: #FCD34D; font-weight: 800; cursor: pointer; min-height: 32px; }

/* lock */
.lock { position: fixed; inset: 0; z-index: 80; background: radial-gradient(circle at 50% 10%, #132242, #04070F 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
.lock h2 { margin: 0; font: 700 20px var(--f-display); letter-spacing: .08em; }
.pin-dots { display: flex; gap: 12px; height: 16px; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--gold); display: block; }
.pin-dots i.f { background: var(--gold); }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
.keypad button { height: 64px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card); font: 600 22px var(--f-num); cursor: pointer; color: var(--text); }

/* invoice paper */
.paper { background: #fff; color: #0B1324; border-radius: 6px; padding: 18px; font-size: 12.5px; line-height: 1.45; overflow-x: auto; }
.paper h1 { font: 700 22px/1.1 var(--f-display); margin: 0; letter-spacing: .06em; color: #0B1324; }
.paper .inv-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.paper table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 12px; min-width: 460px; }
.paper th { background: #0B1324; color: #fff; text-align: left; padding: 6px; font-size: 11px; }
.paper td { padding: 6px; border-bottom: 1px solid #E2E6EE; vertical-align: top; }
.paper .r { text-align: right; font-family: var(--f-num); }
.paper .tot { margin-left: auto; width: min(280px, 100%); }
.paper .tot div { display: flex; justify-content: space-between; padding: 3px 0; }
.paper .due { background: #FBF3DC; padding: 6px 8px !important; font-weight: 700; border-radius: 4px; }
.paper .bank { margin-top: 12px; background: #F4F6FA; border-radius: 6px; padding: 10px; }
.paper .note { color: #8A6B14; font-style: italic; }
#printArea { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff !important; }
  body::before, #app, .nav, .fab, .modal-back, .toast, .lock { display: none !important; }
  #printArea { display: block !important; }
  #printArea .paper { border-radius: 0; padding: 0; overflow: visible; }
  #printArea table { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* documents */

<div id="modalRoot" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="lock" id="lock" hidden></div>
<div id="printArea"></div>
<input type="file" id="docFileIn" accept="image/*,application/pdf" multiple hidden>
<script>
/* GuardShift Royale - core logic (pure functions, no DOM). Money in cents, durations in minutes. */
(function (root) {
  'use strict';
  const L = {};

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, '0');
  L.pad = pad;
  L.ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  L.parseYMD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  L.addDays = (s, n) => { const d = L.parseYMD(s); d.setDate(d.getDate() + n); return L.ymd(d); };
  L.dow = s => L.parseYMD(s).getDay();
  L.daysBetween = (a, b) => Math.round((L.parseYMD(b) - L.parseYMD(a)) / 86400000);
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  L.DAYS = DAYS; L.MONTHS = MONTHS;
  L.fmtDate = s => { if (!s) return '-'; const d = L.parseYMD(s); return `${DAYS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
  L.fmtShort = s => { if (!s) return '-'; const d = L.parseYMD(s); return `${DAYS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
  L.toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  L.minToHM = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
  L.fmtTime = (t, clock24 = true) => {
    if (!t) return '--:--';
    if (clock24) return t;
    let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
    return `${h}:${pad(m)} ${ap}`;
  };
  L.fmtHours = min => (Math.round(min / 6) / 10).toFixed(1) + ' h';
  L.mondayOf = s => { const d = L.dow(s); return L.addDays(s, d === 0 ? -6 : 1 - d); };

  // ---------- money ----------
  const fmtAUD = new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD' });
  L.money = c => fmtAUD.format((c || 0) / 100);
  L.toCents = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : Math.round(n * 100); };
  L.centsToInput = c => (c || c === 0) ? (c / 100).toFixed(2) : '';

  // ---------- holidays (QLD, from qld.gov.au; user editable) ----------
  L.QLD_HOLIDAYS = [
    ['2026-01-01', "New Year's Day"], ['2026-01-26', 'Australia Day'], ['2026-04-03', 'Good Friday'],
    ['2026-04-04', 'Day after Good Friday'], ['2026-04-05', 'Easter Sunday'], ['2026-04-06', 'Easter Monday'],
    ['2026-04-25', 'Anzac Day'], ['2026-05-04', 'Labour Day'], ['2026-08-12', 'Royal Qld Show (Brisbane)'],
    ['2026-10-05', "King's Birthday"], ['2026-12-25', 'Christmas Day'], ['2026-12-26', 'Boxing Day'],
    ['2026-12-28', 'Boxing Day (additional)'],
    ['2027-01-01', "New Year's Day"], ['2027-01-26', 'Australia Day'], ['2027-03-26', 'Good Friday'],
    ['2027-03-27', 'Day after Good Friday'], ['2027-03-28', 'Easter Sunday'], ['2027-03-29', 'Easter Monday'],
    ['2027-04-26', 'Anzac Day'], ['2027-05-03', 'Labour Day'], ['2027-08-11', 'Royal Qld Show (Brisbane)'],
    ['2027-10-04', "King's Birthday"], ['2027-12-25', 'Christmas Day'], ['2027-12-27', 'Christmas Day (additional)'],
    ['2027-12-26', 'Boxing Day'], ['2027-12-28', 'Boxing Day (additional)']
  ].map(([date, name]) => ({ date, name }));

  // ---------- shift time & pay ----------
  // Returns {start: Date, end: Date, overnight} using actual times when present.
  L.shiftSpan = (sh, rostered = false) => {
    const s = (!rostered && sh.actualStart) || sh.start, e = (!rostered && sh.actualEnd) || sh.end;
    if (!sh.date || !s || !e) return null;
    const start = L.parseYMD(sh.date); const sm = L.toMin(s); start.setHours(Math.floor(sm / 60), sm % 60, 0, 0);
    const end = L.parseYMD(sh.date); const em = L.toMin(e); end.setHours(Math.floor(em / 60), em % 60, 0, 0);
    if (end <= start) end.setDate(end.getDate() + 1);
    return { start, end, overnight: end.getDate() !== start.getDate() };
  };
  L.netMinutes = sh => {
    const sp = L.shiftSpan(sh); if (!sp) return 0;
    if (sh.start === sh.end && !sh.actualStart && !sh.actualEnd) return 0;
    const gross = Math.round((sp.end - sp.start) / 60000);
    return Math.max(0, gross - (Number(sh.breakMin) || 0));
  };
  L.endDate = sh => { const sp = L.shiftSpan(sh); return sp ? L.ymd(sp.end) : sh.date; };

  L.RATE_LABEL = { AUTO: 'Auto', WEEKDAY: 'Weekday', NIGHT: 'Night', SATURDAY: 'Saturday', SUNDAY: 'Sunday',
    PUBLIC_HOLIDAY: 'Public holiday', CUSTOM: 'Custom', FLAT: 'Flat' };
  const inWindow = (t, ws, we) => { const m = L.toMin(t), s = L.toMin(ws), e = L.toMin(we);
    return s <= e ? (m >= s && m < e) : (m >= s || m < e); };
  // Which rate type applies automatically (rule: by START; PH > Sun > Sat > night > weekday)
  L.autoRateType = (sh, con, holidays) => {
    if (!sh.date) return 'WEEKDAY';
    if ((holidays || []).some(h => h.date === sh.date)) return 'PUBLIC_HOLIDAY';
    const d = L.dow(sh.date);
    if (d === 0) return 'SUNDAY';
    if (d === 6) return 'SATURDAY';
    if (con && sh.start && inWindow(sh.start, con.nightStart || '19:00', con.nightEnd || '06:00')) return 'NIGHT';
    return 'WEEKDAY';
  };
  const RKEY = { WEEKDAY: 'weekday', NIGHT: 'night', SATURDAY: 'saturday', SUNDAY: 'sunday', PUBLIC_HOLIDAY: 'publicHoliday' };
  // -> {type, cents, flat}
  L.rateFor = (sh, con, holidays) => {
    const rt = sh.rateType || 'AUTO';
    if (rt === 'FLAT') return { type: 'FLAT', cents: 0, flat: sh.flatCents || 0 };
    if (rt === 'CUSTOM') return { type: 'CUSTOM', cents: sh.rateCents || 0 };
    const type = rt === 'AUTO' ? L.autoRateType(sh, con, holidays) : rt;
    let cents = con && con.rates ? con.rates[RKEY[type]] : 0;
    if (!cents && con && con.rates) cents = con.rates.weekday; // fall back to weekday rate
    if (!cents) cents = sh.rateCents || 0;
    return { type, cents: cents || 0 };
  };
  L.totalCents = (sh, con, holidays) => {
    const r = L.rateFor(sh, con, holidays);
    if (r.type === 'FLAT') return r.flat;
    return Math.round(L.netMinutes(sh) * r.cents / 60);
  };

  // ---------- payments & status ----------
  L.paidFor = (shiftId, payments) => {
    let t = 0; for (const p of payments) for (const a of (p.allocations || [])) if (a.shiftId === shiftId) t += a.amountCents;
    return t;
  };
  L.paidOnDate = (sh, total, payments) => { // date when the shift became fully paid
    const list = [];
    for (const p of payments) for (const a of (p.allocations || [])) if (a.shiftId === sh.id) list.push([p.date, a.amountCents]);
    list.sort((x, y) => x[0] < y[0] ? -1 : 1);
    let run = 0; for (const [d, amt] of list) { run += amt; if (run >= total) return d; }
    return null;
  };
  // status ctx: {con, holidays, payments, invoices, now: Date}
  L.status = (sh, ctx) => {
    const total = L.totalCents(sh, ctx.con, ctx.holidays);
    const paid = L.paidFor(sh.id, ctx.payments);
    const owed = Math.max(0, total - paid);
    const today = L.ymd(ctx.now);
    const sp = L.shiftSpan(sh);
    const ended = sp ? sp.end <= ctx.now : false;
    const inv = sh.invoiceId ? (ctx.invoices || []).find(i => i.id === sh.invoiceId) : null;
    let code;
    if (sh.cancelled) code = 'CANCELLED';
    else if (!ended) code = 'UPCOMING';
    else if (total > 0 && paid >= total) code = 'PAID';
    else if (inv && inv.status === 'SENT') code = 'INVOICED';
    else if (paid > 0) code = 'PARTIAL';
    else if (sh.payDate && sh.payDate < today) code = 'OVERDUE';
    else if (sh.payDate === today) code = 'DUE_TODAY';
    else code = 'COMPLETED';
    const overdue = !sh.cancelled && ended && owed > 0 && sh.payDate && sh.payDate < today;
    const overdueDays = overdue ? L.daysBetween(sh.payDate, today) : 0;
    return { code, total, paid, owed: sh.cancelled ? 0 : owed, overdue, overdueDays, ended, inv };
  };

  // ---------- pay date rules ----------
  // rule: {type: WEEKLY_DAY|DAYS_AFTER_SHIFT|FORTNIGHTLY|END_OF_MONTH|ON_THE_NIGHT, value, anchor}
  // Period-based cycles (WEEKLY / FORTNIGHTLY): every shift worked inside one period shares ONE pay date.
  // rule: {type, periodStart:'YYYY-MM-DD' (first day of any known period), payAfter: days after the period's last day}
  L.REF_MONDAY = '2026-01-05';
  L.cycleLen = rule => rule && rule.type === 'FORTNIGHTLY' ? 14 : rule && rule.type === 'WEEKLY' ? 7 : 0;
  L.normRule = rule => {
    if (!rule || !rule.type) return rule || null;
    if ((rule.type === 'FORTNIGHTLY' || rule.type === 'WEEKLY') && !rule.periodStart) {
      const r = Object.assign({}, rule); const len = L.cycleLen(rule); r.payAfter = r.payAfter == null ? 4 : Number(r.payAfter);
      // old style: rule.anchor was a known PAY date -> work back to the period it paid for
      r.periodStart = rule.anchor ? L.addDays(rule.anchor, -(r.payAfter + len - 1)) : L.REF_MONDAY;
      return r;
    }
    return rule;
  };
  L.periodOf = (workYmd, rule) => {
    rule = L.normRule(rule); const len = L.cycleLen(rule); if (!len || !workYmd) return null;
    const k = Math.floor(L.daysBetween(rule.periodStart, workYmd) / len);
    const start = L.addDays(rule.periodStart, k * len), end = L.addDays(start, len - 1);
    const pa = Number(rule.payAfter); return { start, end, pay: L.addDays(end, isNaN(pa) ? 4 : pa), len };
  };
  // workYmd = the day the shift starts (falls back to end date)
  L.payDateFrom = (endYmd, rule, workYmd) => {
    if (!rule || !endYmd) return null;
    const v = Number(rule.value);
    switch (rule.type) {
      case 'WEEKLY': case 'FORTNIGHTLY': { const p = L.periodOf(workYmd || endYmd, rule); let d = p.pay; if (d < endYmd) d = endYmd; return d; }
      case 'WEEKLY_DAY': { const d = L.dow(endYmd); let add = (v - d + 7) % 7; if (add === 0) add = 7; return L.addDays(endYmd, add); }
      case 'DAYS_AFTER_SHIFT': return L.addDays(endYmd, isNaN(v) ? 7 : v);
      case 'END_OF_MONTH': {
        const e = L.parseYMD(endYmd); let last = new Date(e.getFullYear(), e.getMonth() + 1, 0);
        if (L.ymd(last) === endYmd) last = new Date(e.getFullYear(), e.getMonth() + 2, 0);
        return L.ymd(last);
      }
      case 'ON_THE_NIGHT': return endYmd;
      default: return null;
    }
  };
  L.payDateForShift = (sh, rule) => sh && sh.date ? L.payDateFrom(L.endDate(sh), rule, sh.date) : null;
  L.PAY_RULE_LABEL = { FORTNIGHTLY: 'Fortnightly', WEEKLY: 'Weekly', WEEKLY_DAY: 'Next weekday',
    DAYS_AFTER_SHIFT: 'Days after shift', END_OF_MONTH: 'End of month', ON_THE_NIGHT: 'Cash on the night' };
  const WDN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  L.describeRule = r => {
    if (!r) return 'Not set';
    if (r.type === 'FORTNIGHTLY' || r.type === 'WEEKLY') { const n = L.normRule(r); const pa = Number(n.payAfter);
      return `${r.type === 'FORTNIGHTLY' ? 'Fortnightly' : 'Weekly'}, ${WDN[L.dow(n.periodStart)].slice(0, 3)}–${WDN[(L.dow(n.periodStart) + 6) % 7].slice(0, 3)}, paid ${pa === 0 ? 'on the last day' : pa === 1 ? 'the next day' : WDN[(L.dow(n.periodStart) + 6 + pa) % 7] + ' after (' + pa + ' days)'}`; }
    if (r.type === 'WEEKLY_DAY') return 'Every ' + WDN[Number(r.value)];
    if (r.type === 'DAYS_AFTER_SHIFT') return `${r.value} days after each shift`;
    return L.PAY_RULE_LABEL[r.type] || r.type;
  };
  // Group owed/paid shifts into pay batches: one batch = one contractor + one pay date.
  // shifts need {id, contractorId, date, payDate}; stat(s) -> {total, paid, owed, ended, cancelled?}
  L.payBatches = (shifts, stat, ruleOf) => {
    const m = {};
    shifts.forEach(s => { if (s.cancelled || !s.payDate) return; const k = s.contractorId + '|' + s.payDate;
      const b = m[k] || (m[k] = { key: k, contractorId: s.contractorId, payDate: s.payDate, shifts: [], total: 0, paid: 0, owed: 0, minutes: 0, notEnded: 0, from: s.date, to: s.date });
      const st = stat(s); b.shifts.push(s); b.total += st.total; b.paid += Math.min(st.paid, st.total); b.owed += st.owed; b.minutes += st.minutes || 0;
      if (!st.ended) b.notEnded++; if (s.date < b.from) b.from = s.date; if (s.date > b.to) b.to = s.date; });
    return Object.values(m).map(b => { const rule = ruleOf ? ruleOf(b.contractorId) : null; const p = rule ? L.periodOf(b.from, rule) : null;
      if (p && b.to <= p.end && b.payDate !== '0000-nopay') { b.periodStart = p.start; b.periodEnd = p.end; b.cycle = L.normRule(rule).type; }
      b.shifts.sort((x, y) => x.date < y.date ? -1 : 1); return b; }).sort((a, b) => a.payDate < b.payDate ? -1 : a.payDate > b.payDate ? 1 : 0);
  };

  // ---------- clash & rest ----------
  // shifts: array with id; returns {id: [{type:'CLASH'|'REST'|'LONG', other, gapH}]}
  L.conflicts = (shifts, opts) => {
    const restMin = (opts.restHours ?? 8) * 60, longMin = (opts.longHours ?? 12) * 60;
    const items = shifts.filter(s => !s.cancelled).map(s => ({ s, sp: L.shiftSpan(s) })).filter(x => x.sp)
      .sort((a, b) => a.sp.start - b.sp.start);
    const out = {}; const add = (id, w) => (out[id] = out[id] || []).push(w);
    for (let i = 0; i < items.length; i++) {
      const A = items[i];
      if (L.netMinutes(A.s) > longMin) add(A.s.id, { type: 'LONG', hours: L.netMinutes(A.s) / 60 });
      for (let j = i + 1; j < items.length; j++) {
        const B = items[j];
        if (B.sp.start - A.sp.end > restMin * 60000) break;
        // because sorted by start, a later B could still clash with a long A; continue scanning
        if (Math.max(A.sp.start, B.sp.start) < Math.min(A.sp.end, B.sp.end)) {
          add(A.s.id, { type: 'CLASH', other: B.s.id }); add(B.s.id, { type: 'CLASH', other: A.s.id });
        } else {
          const gap = (B.sp.start - A.sp.end) / 60000;
          if (gap >= 0 && gap < restMin) {
            add(A.s.id, { type: 'REST', other: B.s.id, gapH: gap / 60, after: false });
            add(B.s.id, { type: 'REST', other: A.s.id, gapH: gap / 60, after: true });
          }
        }
      }
    }
    return out;
  };
  // check one candidate (not yet saved) against saved shifts
  L.checkCandidate = (cand, shifts, opts) => {
    const c = Object.assign({}, cand, { id: '__cand' });
    const res = L.conflicts(shifts.filter(s => s.id !== cand.id).concat([c]), opts);
    return res['__cand'] || [];
  };

  // ---------- lump payment allocation (oldest owed first) ----------
  // owedList: [{id, date, owed}] ; returns {allocations, leftover}
  L.allocate = (amount, owedList) => {
    let left = amount; const allocations = [];
    const sorted = owedList.slice().sort((a, b) => (a.date + (a.start || '')) < (b.date + (b.start || '')) ? -1 : 1);
    for (const it of sorted) {
      if (left <= 0) break; if (it.owed <= 0) continue;
      const amt = Math.min(left, it.owed); allocations.push({ shiftId: it.id, amountCents: amt }); left -= amt;
    }
    return { allocations, leftover: left };
  };

  // ---------- invoice ----------
  L.invoiceTotals = lines => {
    const minutes = lines.reduce((a, l) => a + l.minutes, 0);
    const gross = lines.reduce((a, l) => a + l.amount, 0);
    const paid = lines.reduce((a, l) => a + l.paid, 0);
    return { minutes, gross, paid, due: gross - paid };
  };
  L.invoiceTitle = () => 'INVOICE';

  // ---------- phone ----------
  L.PHONE_RE = /(?:\+?61[\s-]?4\d{2}|\b04\d{2})[\s-]?\d{3}[\s-]?\d{3}\b/g;
  L.normPhone = p => {
    let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('61')) d = '0' + d.slice(2);
    if (d.length === 10 && d.startsWith('04')) return `${d.slice(0, 4)} ${d.slice(4, 7)} ${d.slice(7)}`;
    return p ? String(p).trim() : '';
  };
  L.waNumber = p => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '61' + d.slice(1); return d; };

  // ---------- PARSER ----------
  const WD = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const WD_RE = /\b(mon|tue|wed|thu|fri|sat|sun)(?:day|s|sday|nesday|rsday|urday|\.)?\b/i;
  const NUMDATE_RE = /\b(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b(?!\s*(?:am|pm|a\.m|p\.m))/i;
  const TXTDATE_RE = /\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:\s+(20\d{2}))?\b/i;
  const TXTDATE2_RE = /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(20\d{2}))?\b/i;
  const WDDAY_RE = /\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)\b/i;
  const REL_RE = /\b(today|tonight|tomorrow|tmrw|tmr)\b/i;
  const THISNEXT_RE = /\b(this|next)\s+(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b/i;

  const validDate = (y, m, d) => { const dt = new Date(y, m - 1, d); return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d; };
  const inferYear = (m, d, today) => { // this year unless >60 days in the past
    const y = today.getFullYear(); const cand = new Date(y, m - 1, d);
    return (today - cand) / 86400000 > 60 ? y + 1 : y;
  };
  // find date in a string -> {ymd, conf, reason, match:[index,len]} or null
  L.findDate = (str, today) => {
    let m, y, mo, d, matched;
    if ((m = NUMDATE_RE.exec(str))) {
      d = +m[1]; mo = +m[2]; y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null;
      const sep = m[0].replace(/^\d{1,2}/, '')[0];
      const near = Math.min(Math.abs(mo - (today.getMonth() + 1)), 12 - Math.abs(mo - (today.getMonth() + 1))) <= 2;
      let okSep = sep === '/' || !!m[3] || near; // "10-6" is more likely a time range than 10 June
      if (okSep && sep !== '/' && !m[3]) { const w = WD_RE.exec(str); if (w && y === undefined) { /* checked below */ }
        if (w) { const yy = inferYear(mo, d, today); if (validDate(yy, mo, d) && WD[w[1].toLowerCase()] !== new Date(yy, mo - 1, d).getDay()) okSep = false; } }
      if (okSep && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) { y = y || inferYear(mo, d, today); if (validDate(y, mo, d)) matched = m; }
    }
    if (!matched && (m = TXTDATE_RE.exec(str))) { d = +m[1]; mo = MON[m[2].toLowerCase()]; y = m[3] ? +m[3] : inferYear(mo, d, today); if (validDate(y, mo, d)) matched = m; }
    if (!matched && (m = TXTDATE2_RE.exec(str))) { d = +m[2]; mo = MON[m[1].toLowerCase()]; y = m[3] ? +m[3] : inferYear(mo, d, today); if (validDate(y, mo, d)) matched = m; }
    const wdm = WD_RE.exec(str);
    if (matched) {
      const ymd = `${y}-${pad(mo)}-${pad(d)}`;
      const res = { ymd, conf: 'HIGH', reason: '', kind: 'strong', match: [matched.index, matched[0].length] };
      if (wdm && WD[wdm[1].toLowerCase()] !== L.dow(ymd)) {
        res.conf = 'CHECK'; res.reason = `Message says ${DAYS[WD[wdm[1].toLowerCase()]]} but ${pad(d)}/${pad(mo)} is a ${DAYS[L.dow(ymd)]}`;
      }
      return res;
    }
    if ((m = WDDAY_RE.exec(str))) { // "Fri 13th" - find nearest date with that day number and weekday
      const want = WD[m[1].toLowerCase()], dn = +m[2];
      for (let k = -1; k < 13; k++) {
        const dt = new Date(today.getFullYear(), today.getMonth() + k, dn);
        if (dt.getDate() === dn && dt.getDay() === want && (today - dt) / 86400000 <= 60) return { ymd: L.ymd(dt), conf: 'HIGH', reason: '', kind: 'strong', match: [m.index, m[0].length] };
      }
    }
    if ((m = REL_RE.exec(str))) {
      const w = m[1].toLowerCase(); const t = L.ymd(today);
      return { ymd: w.startsWith('to') && w !== 'tomorrow' ? t : L.addDays(t, 1), conf: 'HIGH', reason: '', match: [m.index, m[0].length] };
    }
    if ((m = THISNEXT_RE.exec(str))) {
      const want = WD[m[2].toLowerCase()]; const t = L.ymd(today); let add = (want - today.getDay() + 7) % 7;
      if (m[1].toLowerCase() === 'next' && add === 0) add = 7;
      return { ymd: L.addDays(t, add), conf: m[1].toLowerCase() === 'next' ? 'CHECK' : 'HIGH',
        reason: m[1].toLowerCase() === 'next' ? '"next" can mean this week or next week' : '', match: [m.index, m[0].length] };
    }
    if (wdm) {
      const want = WD[wdm[1].toLowerCase()]; const add = (want - today.getDay() + 7) % 7;
      return { ymd: L.addDays(L.ymd(today), add), conf: 'CHECK', reason: 'Only a weekday was given', match: [wdm.index, wdm[0].length] };
    }
    return null;
  };

  // --- times ---
  const TTOK = String.raw`(\d{1,2}(?:[:.]\d{2})?(?:\s*(?:am|pm|a\.m\.?|p\.m\.?)|[ap](?![a-z]))?(?:\s*h(?:rs?)?\b)?|\d{4}(?:\s*h(?:rs?)?\b)?|midnight|midday|noon)`;
  const RANGE_RE = new RegExp(TTOK + String.raw`\s*(?:-|–|—|to|till|til|until|>)\s*` + `(${TTOK.slice(1, -1)}|close|finish|late)`, 'i');
  const STARTFIN_RE = new RegExp(String.raw`start(?:s|ing)?\s*(?:at|@)?\s*` + TTOK + String.raw`[\s\S]{0,30}?(?:finish|end)(?:s|ing)?\s*(?:at|@)?\s*` + TTOK, 'i');
  // parse a time token -> {opts:[minutes...], explicit}
  const tokOptions = tok => {
    const t = tok.toLowerCase().replace(/\s+/g, '').replace(/h(?:rs?)?$/, '');
    if (t === 'midnight') return { opts: [0], explicit: true };
    if (t === 'noon' || t === 'midday') return { opts: [720], explicit: true };
    let ap = null; let core = t;
    const apm = /(am|pm|a\.m\.?|p\.m\.?|a|p)$/.exec(t); if (apm) { ap = apm[1][0]; core = t.slice(0, apm.index); }
    let h, mi = 0;
    if (/^\d{4}$/.test(core)) { h = +core.slice(0, 2); mi = +core.slice(2); if (h === 24) h = 0; }
    else { const p = core.split(/[:.]/); h = +p[0]; mi = p[1] ? +p[1] : 0; }
    if (isNaN(h) || h > 24 || mi > 59) return null;
    if (h === 24) h = 0;
    if (ap) { if (h > 12) return null; if (ap === 'a') h = h % 12; else h = (h % 12) + 12; return { opts: [h * 60 + mi], explicit: true }; }
    if (h > 12 || h === 0 || /^\d{4}$/.test(core) || /^\d{1,2}[:.]\d{2}$/.test(core) && h >= 13) return { opts: [h * 60 + mi], explicit: true };
    if (/^\d{1,2}[:.]\d{2}$/.test(core) && h <= 12) {
      // "06:00" style with leading zero = 24h explicit
      if (/^0\d/.test(core)) return { opts: [h * 60 + mi], explicit: true };
    }
    return { opts: h === 12 ? [12 * 60 + mi, mi] : [h * 60 + mi, (h + 12) * 60 + mi], explicit: false };
  };
  const dur = (a, b) => { let d = b - a; if (d <= 0) d += 1440; return d; };
  const pickRange = (A, B) => {
    let best = null;
    for (const a of A.opts) for (const b of B.opts) {
      const d = dur(a, b); const score = Math.abs(d - 480) + (d < 180 || d > 16 * 60 ? 10000 : 0) - a / 10000;
      if (!best || score < best.score) best = { a, b, score };
    }
    return best;
  };
  L.findTimes = str => {
    let m = STARTFIN_RE.exec(str) || RANGE_RE.exec(str);
    if (!m) return null;
    const A = tokOptions(m[1]);
    const endTok = m[2];
    if (!A) return null;
    if (/^(close|finish|late)$/i.test(endTok)) {
      return { start: L.minToHM(A.opts[A.opts.length - 1]), end: null, conf: 'CHECK', reason: 'Finish time not given ("' + endTok + '")', match: [m.index, m[0].length] };
    }
    const B = tokOptions(endTok); if (!B) return null;
    const p = pickRange(A, B);
    const conf = (!A.explicit && !B.explicit) ? 'CHECK' : 'HIGH';
    return { start: L.minToHM(p.a), end: L.minToHM(p.b), conf,
      reason: conf === 'CHECK' ? `"${m[0].trim()}" read as ${L.minToHM(p.a)}-${L.minToHM(p.b)}` : '', match: [m.index, m[0].length] };
  };

  // --- rate ---
  L.findRate = str => {
    let m;
    if ((m = /\$\s?(\d+(?:\.\d{1,2})?)\s*(?:flat|for the shift|total|all in)\b/i.exec(str))) return { flat: true, cents: Math.round(+m[1] * 100), match: m };
    // "flat rate $280", "flat $280", "total $300", "$300 cash", "$280 for the night"
    if ((m = /\b(?:flat(?:\s*rate)?|total|fixed|all\s*in)\s*(?:of|is|:|=)?\s*\$\s?(\d+(?:\.\d{1,2})?)/i.exec(str))) return { flat: true, cents: Math.round(+m[1] * 100), match: m };
    if ((m = /\$\s?(\d{3,4}(?:\.\d{1,2})?)\s*(?:cash|for the (?:night|day|shift)|per (?:night|shift)|a night|a shift|\/\s*(?:night|shift))\b/i.exec(str))) return { flat: true, cents: Math.round(+m[1] * 100), match: m };
    if ((m = /\$\s?(\d{2,3}(?:\.\d{1,2})?)\s*(?:per (?:night|shift)|a night|a shift|\/\s*(?:night|shift)|for the (?:night|shift))\b/i.exec(str))) return { flat: true, cents: Math.round(+m[1] * 100), match: m };
    if ((m = /\$?\s?(\d{2,3}(?:\.\d{1,2})?)\s*(?:\/\s*h(?:ou)?r?s?\b|\/h\b|p\/h\b|ph\b|phr\b|per\s*h(?:ou)?r|an?\s*h(?:ou)?r|\/\s*hour)/i.exec(str))) return { flat: false, cents: Math.round(+m[1] * 100), match: m };
    if ((m = /\brate\s*(?:of|is|:|=)?\s*\$?\s?(\d{2,3}(?:\.\d{1,2})?)/i.exec(str))) { const v = +m[1]; return v >= 120 ? { flat: true, cents: Math.round(v * 100), match: m, weak: true } : { flat: false, cents: Math.round(v * 100), match: m }; }
    if ((m = /\$\s?(\d{3,4}(?:\.\d{1,2})?)\b/i.exec(str)) && +m[1] >= 120) return { flat: true, cents: Math.round(+m[1] * 100), match: m, weak: true };
    if ((m = /\$\s?(\d{2}(?:\.\d{1,2})?)\b(?!\s*(?:flat|total))/i.exec(str))) return { flat: false, cents: Math.round(+m[1] * 100), match: m, weak: true };
    return null;
  };
  L.findBreak = str => {
    let m;
    if ((m = /\b(1\/2|half)\s*(?:an?\s*)?(?:hr|hour)\s*(?:unpaid\s*)?break/i.exec(str))) return 30;
    if ((m = /\b1\s*(?:hr|hour)\s*(?:unpaid\s*)?break/i.exec(str))) return 60;
    if ((m = /\b(\d{1,3})\s*(?:min(?:ute)?s?|m)\s*(?:unpaid\s*)?break/i.exec(str))) return +m[1];
    if ((m = /\bbreak\s*(?:of\s*)?(\d{1,3})\s*(?:min|m)?/i.exec(str))) return +m[1];
    return null;
  };
  L.findPayRule = str => {
    let m;
    if (/\b(?:cash|paid|pay)\s*(?:on|at|in)?\s*(?:the\s*)?(?:night|end of shift|shift end|on the day)\b/i.test(str)) return { type: 'ON_THE_NIGHT' };
    if ((m = /\b(\d{1,2})\s*days?\s*(?:after|later|from)/i.exec(str))) return { type: 'DAYS_AFTER_SHIFT', value: +m[1] };
    if (/\bfortnight(?:ly)?\b/i.test(str)) return { type: 'FORTNIGHTLY', value: null, periodStart: null, payAfter: 4, check: true };
    if ((m = /\bpa(?:y|id|yment|yday)\b[^\n.]{0,25}?\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*/i.exec(str))) return { type: 'WEEKLY_DAY', value: WD[m[1].toLowerCase()] };
    if (/\bend of (?:the )?month\b/i.test(str)) return { type: 'END_OF_MONTH' };
    if (/\b(?:paid|pay)\s*weekly\b/i.test(str)) return { type: 'DAYS_AFTER_SHIFT', value: 7, check: true };
    return null;
  };

  const STOP = new Set(('mon monday tue tues tuesday wed wednesday thu thur thurs thursday fri friday sat saturday sun sunday ' +
    'jan feb mar apr may jun jul aug sep oct nov dec january february march april june july august september october november december ' +
    'shift shifts need needed guard guards guarding this next week wk team hi hey all today tonight tomorrow night day start starts finish ' +
    'rate pay paid payment call contact text ring update updated please pls thanks thank you reply asap available anyone who can ' +
    'am pm hr hrs hour hours per ph x the a an and for from to till until at on in of with is are be will crowd control controller ' +
    'site location venue post break min mins unpaid cash collected after weekly fortnightly flat total ' +
    'urgent asap required req help hello hiya guys mate cover covering someone anybody avail staff officer officers security plz thx cheers ' +
    'confirm interested let me know dm msg message if you free i we have got our my your please x2 x3 two three both also only more ' +
    'midnight noon midday close late tmrw tmr tonite p a hrs h').split(' '));
  const cleanSite = v => String(v || '').split(/\s*(?:\$|\bcall\b|\bcontact\b|\bph\b|\bphone\b|\brate\b|\bpay\b|\bpaid\b|\bstart|\bfinish|\b(?:mon|tue|wed|thu|fri|sat|sun)(?:day|s|sday|nesday|rsday|urday)?\b|\b(?:today|tonight|tomorrow|tmrw)\b|\d{1,2}[\/.]\d{1,2}|\b\d{4}\b|\d{1,2}(?:[:.]\d{2})?\s*(?:am|pm)\b|\d{3,4}\s*-|\.\s|\.$|!|\?)/i)[0].replace(/[\s\-:,;.]+$/, '').replace(/^[\s\-:,;.@]+/, '').replace(/\s{2,}/g, ' ').trim();

  const stripRanges = (str, ranges) => {
    let out = str; ranges.filter(Boolean).sort((a, b) => b[0] - a[0]).forEach(([i, len]) => { out = out.slice(0, i) + ' '.repeat(len) + out.slice(i + len); });
    return out;
  };
  L.findSite = (block, knownSites) => {
    let m;
    if ((m = /\b(?:site|location|venue|post|address|where)\s*[:\-]\s*([^\n,;]+)/i.exec(block)) && cleanSite(m[1])) return { value: cleanSite(m[1]), conf: 'HIGH', how: 'label' };
    if ((m = /(?:@|\bat\s+(?=[A-Z]))\s*([A-Za-z][^\n,;$]{2,50})/.exec(block)) && cleanSite(m[1]).length > 2) return { value: cleanSite(m[1]), conf: 'HIGH', how: 'label' };
    // known site mentioned?
    const low = block.toLowerCase();
    for (const k of (knownSites || [])) { const key = k.toLowerCase(); const last = key.split(' ').filter(w => w.length > 3).pop();
      if (low.includes(key) || (last && new RegExp('\\b' + last.replace(/[^a-z0-9]/g, '') + '\\b').test(low))) return { value: k, conf: 'HIGH', how: 'known' }; }
    // leftover capitalised words ("Port of Brisbane", "Suncorp Stadium (Gate 5)")
    const words = block.replace(/[^A-Za-z0-9'&\s-]/g, ' ').split(/\s+/).map(w => w.replace(/^[-']+|[-']+$/g, '')).filter(Boolean);
    const JOIN = new Set(['of', 'the', 'on', 'and', '&', 'de', 'upon']); const NUMWORD = /^(gate|level|terminal|door|dock|entrance|entry|bay|zone|area|post|lot|wharf|pier|shed|building|block|tower|stage|carpark|car)$/i;
    let best = [], cur = [];
    const good = w => w && w.length > 1 && !STOP.has(w.toLowerCase()) && /^[A-Za-z]/.test(w);
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      const num = /^\d{1,3}[A-Za-z]?$/.test(w) && cur.length && NUMWORD.test(cur[cur.length - 1]);
      const join = cur.length && JOIN.has(w.toLowerCase()) && good(words[i + 1]) && /^[A-Z]/.test(words[i + 1]);
      if (good(w) || num || join) cur.push(join ? w.toLowerCase() : w); else { if (cur.length > best.length) best = cur; cur = []; }
    }
    if (cur.length > best.length) best = cur;
    if (best.length) {
      const v = best.slice(0, 6).map(w => /^(of|the|on|and|&|de|upon)$/.test(w) ? w : w[0].toUpperCase() + w.slice(1)).join(' ');
      return { value: v, conf: 'HIGH', how: 'words' };
    }
    return null;
  };
  L.findContact = (text, phoneMatch) => {
    const before = text.slice(Math.max(0, phoneMatch.index - 40), phoneMatch.index);
    const line = before.split('\n').pop();
    const m = /([A-Z][a-z]{1,15})\s*(?:on|at|-|:|\()?\s*$/.exec(line);
    if (m && !/^(Contact|Call|Phone|Mobile|Mob|Text|Ph|Ring|Number|Sup|Supervisor|Whatsapp|Msg)$/i.test(m[1])) return m[1];
    const after = text.slice(phoneMatch.index + phoneMatch[0].length, phoneMatch.index + phoneMatch[0].length + 25);
    const m2 = /^\s*(?:\(|-)?\s*([A-Z][a-z]{1,15})\b/.exec(after);
    return m2 ? m2[1] : '';
  };
  L.matchContractor = (text, contractors) => {
    const digits = text.replace(/\D/g, '');
    for (const c of contractors) { const p = String(c.phone || '').replace(/\D/g, ''); if (p.length >= 9 && digits.includes(p.slice(-9))) return { id: c.id, conf: 'HIGH', how: 'phone' }; }
    const low = text.toLowerCase();
    for (const c of contractors) {
      if (!c.name) continue; const n = c.name.toLowerCase();
      if (low.includes(n)) return { id: c.id, conf: 'HIGH', how: 'name' };
      const first = n.split(/\s+/)[0]; if (first.length >= 4 && new RegExp('\\b' + first.replace(/[^a-z0-9]/g, '') + '\\b').test(low)) return { id: c.id, conf: 'HIGH', how: 'name' };
    }
    return null;
  };

  // MAIN: parse text into shifts
  L.parseShiftText = (text, contractors, today, opts = {}) => {
    contractors = contractors || []; today = today || new Date();
    if (!text || !text.trim()) return [];
    const lines = text.replace(/\r/g, '').split('\n');
    // global fields
    const phoneMatches = [...text.matchAll(L.PHONE_RE)];
    const phone = phoneMatches.length ? L.normPhone(phoneMatches[0][0]) : '';
    const contact = phoneMatches.length ? L.findContact(text, phoneMatches[0]) : '';
    const cMatch = L.matchContractor(text, contractors) || (opts.contractorHint ? { id: opts.contractorHint, conf: 'CHECK', how: 'hint' } : null);
    const con = cMatch ? contractors.find(c => c.id === cMatch.id) : null;
    const textNoPhone = text.replace(L.PHONE_RE, m => ' '.repeat(m.length));
    const globalRate = L.findRate(textNoPhone);
    const globalBreak = L.findBreak(textNoPhone);
    const payRule = L.findPayRule(textNoPhone);
    // blocks: a line with a date starts a new block
    const blocks = []; const pre = [];
    for (const raw of lines) {
      const line = raw.replace(L.PHONE_RE, m => ' '.repeat(m.length));
      const clean = line.replace(/\$\s?\d+(\.\d+)?/g, '');
      const fd = L.findDate(clean, today);
      const hasTime = !!L.findTimes(fd ? stripRanges(clean, [fd.match]) : clean);
      const strong = fd && fd.kind === 'strong';
      const weak = fd && !strong && !/\bpa(?:y|id|yment|yday)\b[^\n]{0,12}$/i.test(clean.slice(0, fd.match[0]));
      const hasDate = strong || (weak && (hasTime || /^\s*(?:\w+\s+){0,3}?(mon|tue|wed|thu|fri|sat|sun|today|tonight|tomorrow)/i.test(clean)));
      if (hasDate) blocks.push({ lines: [line], hasTime });
      else if (blocks.length && hasTime && !blocks[blocks.length - 1].hasTime) { blocks[blocks.length - 1].lines.push(line); blocks[blocks.length - 1].hasTime = true; }
      else if (blocks.length && hasTime && blocks[blocks.length - 1].hasTime) blocks.push({ lines: [line], noDate: true, hasTime });
      else if (blocks.length) blocks[blocks.length - 1].lines.push(line);
      else pre.push(line);
    }
    if (!blocks.length) { // no date anywhere: one shift from whole text
      if (!L.findTimes(textNoPhone)) return [];
      blocks.push({ lines: pre.splice(0), noDate: true });
    }
    const knownSites = con ? (con.knownSites || []) : [];
    const results = [];
    for (const b of blocks) {
      const blockText = b.lines.join('\n');
      const f = {};
      const dt = b.noDate ? null : L.findDate(blockText, today);
      f.date = dt ? { value: dt.ymd, conf: dt.conf, reason: dt.reason } : { value: '', conf: 'MISSING', reason: 'No date found' };
      const afterDate = dt ? stripRanges(blockText, [dt.match]) : blockText;
      const noMoney = afterDate.replace(/\$\s?\d+(?:\.\d{1,2})?\s*(?:\/\s*h(?:ou)?r?s?|p\/h|ph|per\s*h(?:ou)?r|an?\s*h(?:ou)?r|flat)?/gi, m => ' '.repeat(m.length));
      const tm = L.findTimes(noMoney);
      if (tm) {
        f.start = { value: tm.start, conf: tm.conf, reason: tm.reason };
        f.end = tm.end ? { value: tm.end, conf: tm.conf, reason: tm.reason } : { value: '', conf: 'MISSING', reason: tm.reason };
      } else { f.start = { value: '', conf: 'MISSING', reason: 'No start time found' }; f.end = { value: '', conf: 'MISSING', reason: 'No finish time found' }; }
      const r = L.findRate(noMoney === afterDate ? afterDate : afterDate) || globalRate;
      if (r && r.flat) f.rate = { type: 'FLAT', flatCents: r.cents, conf: 'HIGH', reason: '' };
      else if (r) f.rate = { type: 'CUSTOM', cents: r.cents, conf: r.weak ? 'CHECK' : 'HIGH', reason: r.weak ? 'Dollar amount assumed to be per hour' : '' };
      else if (con) f.rate = { type: 'AUTO', conf: 'CHECK', reason: "Using contractor's usual rates" };
      else f.rate = { type: 'CUSTOM', cents: 0, conf: 'MISSING', reason: 'No pay rate found' };
      const br = L.findBreak(blockText); const brk = br != null ? br : globalBreak;
      f.breakMin = brk != null ? { value: brk, conf: 'HIGH', reason: '' } : { value: 0, conf: 'CHECK', reason: 'No break mentioned, set to 0' };
      // site
      const stripped = stripRanges(noMoney, tm ? [tm.match] : []).replace(/\b\d+\s*(?:am|pm)\b/gi, ' ');
      let site = L.findSite(blockText, knownSites);
      if (!site || site.how === 'words') site = L.findSite(stripped.split('\n')[0], knownSites) || L.findSite(stripped, knownSites);
      if (site && con && con.corrections) {
        const cr = con.corrections.find(x => x.field === 'site' && x.from.toLowerCase() === site.value.toLowerCase());
        if (cr) site = { value: cr.to, conf: 'HIGH', how: 'learned' };
      }
      f.site = site ? { value: site.value, conf: site.conf, reason: site.how === 'learned' ? 'Remembered from your earlier fix' : '' } : { value: '', conf: 'MISSING', reason: 'No site found' };
      f.phone = phone ? { value: phone, conf: 'HIGH', reason: '' } : { value: con ? (con.phone || '') : '', conf: con && con.phone ? 'CHECK' : 'MISSING', reason: con && con.phone ? 'From saved contractor' : 'No phone number found' };
      f.contact = { value: contact || (con ? con.contactName || '' : ''), conf: contact ? 'HIGH' : (con && con.contactName ? 'CHECK' : 'MISSING'), reason: '' };
      f.contractor = cMatch ? { value: cMatch.id, conf: cMatch.conf, reason: cMatch.how === 'phone' ? 'Matched by phone number' : cMatch.how === 'hint' ? 'Chosen contractor' : 'Matched by name' }
        : { value: '', conf: 'MISSING', reason: 'Pick or add the contractor' };
      // pay date
      const tmpShift = { date: f.date.value, start: f.start.value, end: f.end.value || f.start.value };
      const endY = f.date.value && f.start.value && f.end.value ? L.endDate(tmpShift) : f.date.value;
      const sameAsCon = payRule && con && con.payRule && con.payRule.type === payRule.type;
      if (sameAsCon && endY) f.payDate = { value: L.payDateFrom(endY, con.payRule, f.date.value), conf: 'HIGH', reason: '', rule: con.payRule };
      else if (payRule && endY) f.payDate = { value: L.payDateFrom(endY, payRule, f.date.value), conf: payRule.check ? 'CHECK' : 'HIGH', reason: payRule.check ? (L.cycleLen(payRule) ? 'Fortnight guessed as Mon–Sun, paid the Thursday after. Set the real cycle on the contractor.' : 'Pay cycle guessed from message') : '', rule: payRule };
      else if (con && con.payRule && endY) f.payDate = { value: L.payDateFrom(endY, con.payRule, f.date.value), conf: 'CHECK', reason: 'From contractor rule' };
      else if (endY) f.payDate = { value: L.addDays(endY, 7), conf: 'CHECK', reason: 'No pay day found, set 7 days after' };
      else f.payDate = { value: '', conf: 'MISSING', reason: 'Needs a date first' };
      results.push({ fields: f, rawText: blockText.trim() });
      // "Fri 27/11 & Sat 28/11 6pm-2am": one line, several dates -> one shift each
      if (dt && dt.kind === 'strong') {
        let rest = stripRanges(b.lines[0].replace(/\$\s?\d+(\.\d+)?/g, m => ' '.repeat(m.length)), [dt.match]); let x, guard = 0;
        while ((x = L.findDate(rest, today)) && x.kind === 'strong' && guard++ < 6) {
          const txt = rest.substr(x.match[0], x.match[1]); rest = stripRanges(rest, [x.match]);
          if (x.ymd === dt.ymd || !(/\//.test(txt) || /[a-z]/i.test(txt))) continue;
          const before = b.lines[0].slice(0, x.match[0]); const wdb = /\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?\s*$/i.exec(before);
          if (!wdb || WD[wdb[1].toLowerCase()] === L.dow(x.ymd)) { x.conf = 'HIGH'; x.reason = ''; }
          else { x.conf = 'CHECK'; x.reason = `Message says ${DAYS[WD[wdb[1].toLowerCase()]]} but ${x.ymd.slice(8)}/${x.ymd.slice(5, 7)} is a ${DAYS[L.dow(x.ymd)]}`; }
          const g = JSON.parse(JSON.stringify(f)); g.date = { value: x.ymd, conf: x.conf, reason: x.reason };
          const ey = g.start.value && g.end.value ? L.endDate({ date: x.ymd, start: g.start.value, end: g.end.value }) : x.ymd;
          const rule = g.payDate.rule || (payRule) || (con && con.payRule);
          g.payDate.value = rule ? L.payDateFrom(ey, rule, x.ymd) : L.addDays(ey, 7);
          results.push({ fields: g, rawText: blockText.trim() });
        }
      }
    }
    return results;
  };

  // ---------- ICS ----------
  const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const icsDT = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  L.buildICS = (events, tz = 'Australia/Brisbane') => {
    const out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//GuardShift Royale//EN', 'CALSCALE:GREGORIAN'];
    for (const e of events) {
      out.push('BEGIN:VEVENT', `UID:${e.uid}@guardshift`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '')}`,
        `DTSTART;TZID=${tz}:${icsDT(e.start)}`, `DTEND;TZID=${tz}:${icsDT(e.end)}`,
        `SUMMARY:${icsEsc(e.title)}`, `DESCRIPTION:${icsEsc(e.desc)}`);

      .filter(x => x.sp && (x.sp.end > now || x.s.actualStart)).sort((a, b) => (b.s.actualStart ? 1 : 0) - (a.s.actualStart ? 1 : 0) || a.sp.start - b.sp.start);
    if (!cands.length) return S.shifts.length ? `<section class="card gold hero"><div class="label c-gold">Next shift</div><h3>No upcoming shifts</h3><p class="muted small" style="margin:4px 0 12px">Got a new shift in WhatsApp? Add it in seconds.</p><button class="btn gold block" data-act="go" data-tab="scan">Add a shift</button></section>`
      : `<section class="card gold hero first"><div class="label c-gold">Welcome</div><h3>Let's add your first shift</h3>
        <ol class="steps"><li><b>Copy</b> a shift message in WhatsApp (long-press, Copy)</li><li>Tap the gold <b>+</b> below</li><li>Tap <b>Paste &amp; read</b>, check it, save</li></ol>
        <button class="btn gold block" data-act="go" data-tab="scan">Add my first shift</button><div class="arrow-down" aria-hidden="true">↓</div></section>`;
    const { s, sp } = cands[0]; const con = conOf(s.contractorId); const phone = s.supervisorPhone || (con && con.phone) || '';
    const working = !!s.actualStart && !s.actualEnd; const diff = sp.start - now; const canStart = !working && diff <= 3 * 3600000;
    const h = Math.floor(Math.abs(diff) / 3600000), m = Math.floor(Math.abs(diff) % 3600000 / 60000);
    const when = working ? 'On shift' : diff <= 0 ? 'Should have started' : (h >= 24 ? `in ${Math.floor(h / 24)}d ${h % 24}h` : `in ${h}h ${m}m`);
    const le = working ? liveEarned(s) : null;
    return `<section class="card gold hero ${working ? 'working' : ''}">
      <div class="row" style="justify-content:space-between"><span class="label c-gold">${working ? 'Current shift' : 'Next shift'}</span><span class="pill ${working ? 'c-ok' : diff <= 0 ? 'c-warn' : 'c-info'}">${working ? '● ' : ''}${esc(when)}</span></div>
      <h3>${esc(L.fmtDate(s.date))} · ${esc(conName(s))}</h3>
      <div class="muted">${esc(s.siteName || '')}</div>
      <div class="when num">${esc(t(s.start))}-${esc(t(s.end))}${sp.overnight ? ' <small>(+1)</small>' : ''}</div><div class="when-sub num">${L.fmtHours(L.netMinutes(s))} · <b>${L.money(info(s).st.total)}</b></div>
      ${working ? `<button class="btn sm ghost night-btn" data-act="toggleNight">${document.body.classList.contains('night') ? '☀ Brighten screen' : '☾ Dim screen for night post'}</button>` : ''}
      ${le ? `<div class="live"><div><span class="label">Earned so far</span><b class="num">${le.flat ? 'Flat rate' : L.money(le.cents)}</b></div><div><span class="label">Time on shift</span><b class="num">${Math.floor(le.mins / 60)}h ${L.pad(le.mins % 60)}m</b></div><div><span class="label">Started</span><b class="num">${esc(t(s.actualStart))}</b></div></div>` : ''}
      ${phone ? `<div class="small muted num" style="margin-top:6px">Supervisor: ${esc(s.supervisorName || '')} ${esc(phone)} <button class="btn sm ghost" data-act="copy" data-text="${esc(phone)}">Copy</button></div>` : ''}
      <div class="acts">
        ${phone ? `<a class="btn outline" href="tel:${esc(phone.replace(/\s/g, ''))}">Call</a><a class="btn outline" href="https://wa.me/${L.waNumber(phone)}?text=${encodeURIComponent(waMsg(s))}" target="_blank" rel="noopener">Chat</a>` : '<span></span><span></span>'}
        <a class="btn outline" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((s.siteName || '') + ' QLD')}" target="_blank" rel="noopener">Maps</a>
        ${working ? `<button class="btn gold" data-act="endShift" data-id="${s.id}">End</button>` : canStart ? `<button class="btn gold" data-act="startShift" data-id="${s.id}">Start</button>` : `<button class="btn outline" data-act="editShift" data-id="${s.id}">Edit</button>`}
      </div></section>`;
  };

  const kpis = () => {
    const td = today(); const mon = L.mondayOf(td); const sun = L.addDays(mon, 6);
    const wk = S.shifts.filter(s => !s.cancelled && s.date >= mon && s.date <= sun);
    const wkMin = wk.reduce((a, s) => a + L.netMinutes(s), 0); const wkPay = wk.reduce((a, s) => a + info(s).st.total, 0);
    const done = wk.filter(s => info(s).st.ended); const doneMin = done.reduce((a, s) => a + L.netMinutes(s), 0); const donePay = done.reduce((a, s) => a + info(s).st.total, 0);
    const owedList = S.shifts.filter(s => info(s).st.ended && info(s).st.owed > 0);
    const owed = sumOwed(owedList); const overdue = sumOwed(S.shifts.filter(s => info(s).st.overdue));
    const upcomingIds = new Set(S.shifts.filter(s => { const sp = L.shiftSpan(s); return sp && sp.end > new Date(Date.now() - 7 * 86400000); }).map(s => s.id));
    const warnCount = Object.entries(CONF).filter(([id, list]) => upcomingIds.has(id) && list.some(c => c.type !== 'LONG')).length;
    const lic = S.licences.filter(l => l.expiry && L.daysBetween(td, l.expiry) <= 30).length;
    return `<div class="kpis">
      <div class="card gold kpi"><div class="label">To collect</div><div class="val gold-text">${L.money(owed)}</div><div class="foot">${overdue ? `<span class="c-danger">Overdue ${L.money(overdue)}</span>` : `${owedList.length} shift${owedList.length === 1 ? '' : 's'} waiting`}</div></div>

      <div class="card kpi click" data-act="go" data-tab="docs"><div class="label">Compliance</div><div class="val txt ${lic ? 'c-warn' : 'c-ok'}">${lic ? lic + ' expiring' : S.licences.length ? 'All valid' : 'None added'}</div><div class="foot">30-day early warning</div></div>
    </div>`;
  };

  const charts = () => {
    const done = S.shifts.filter(s => !s.cancelled && info(s).st.ended);
    if (!done.length) return '';
    let groups;
    if (ui.chart === 'con') {
      const m = {}; done.forEach(s => { const k = conName(s); const st = info(s).st; m[k] = m[k] || { k, paid: 0, owed: 0 }; m[k].paid += Math.min(st.paid, st.total); m[k].owed += st.owed; });
      groups = Object.values(m).sort((a, b) => (b.paid + b.owed) - (a.paid + a.owed)).slice(0, 6).map(g => ({ ...g, label: g.k.replace(/^Demo Contractor /, 'Demo ') }));
    } else {
      const m = {}; const mon0 = L.mondayOf(today());
      for (let i = 7; i >= 0; i--) { const k = L.addDays(mon0, -7 * i); m[k] = { k, paid: 0, owed: 0, label: L.fmtShort(k).slice(4) }; }
      done.forEach(s => { const k = L.mondayOf(s.date); if (m[k]) { const st = info(s).st; m[k].paid += Math.min(st.paid, st.total); m[k].owed += st.owed; } });
      groups = Object.values(m);
    }
    const W = 340, H = 170, padL = 44, padB = 24, top = 10;
    const max = Math.max(1, ...groups.map(g => Math.max(g.paid, g.owed)));
    const nice = (() => { const raw = max / 100; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = [1, 2, 2.5, 5, 10].find(x => x * p * 4 >= raw) * p; return n * 100; })();
    const ymax = nice * 4; const y = v => top + (H - padB - top) * (1 - v / ymax);
    const gw = (W - padL - 6) / groups.length; const bw = Math.min(16, gw / 2 - 3);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Collected and owed by ${ui.chart === 'con' ? 'contractor' : 'week'}">`;
    for (let i = 0; i <= 4; i++) { const v = nice * i; svg += `<line x1="${padL}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#26304A" stroke-width="1"/><text x="${padL - 6}" y="${y(v) + 3.5}" fill="#94A3B8" font-size="9.5" text-anchor="end" font-family="JetBrains Mono, monospace">$${Math.round(v / 100)}</text>`; }
    groups.forEach((g, i) => {
      const cx = padL + gw * i + gw / 2;
      svg += `<rect x="${cx - bw - 1}" y="${y(g.paid)}" width="${bw}" height="${Math.max(0, H - padB - y(g.paid))}" rx="3" fill="#10B981"><title>${esc(g.label)} collected ${L.money(g.paid)}</title></rect>`;
      svg += `<rect x="${cx + 1}" y="${y(g.owed)}" width="${bw}" height="${Math.max(0, H - padB - y(g.owed))}" rx="3" fill="#E9C46A"><title>${esc(g.label)} owed ${L.money(g.owed)}</title></rect>`;
      svg += `<text x="${cx}" y="${H - 8}" fill="#94A3B8" font-size="9.5" text-anchor="middle">${esc(g.label.length > 11 ? g.label.slice(0, 10) + '…' : g.label)}</text>`;
    });
    svg += '</svg>';
    // donut
    let paidFull = 0, partial = 0, owedT = 0; done.forEach(s => { const st = info(s).st; if (st.code === 'PAID') paidFull += st.total; else { partial += st.paid; owedT += st.owed; } });
    const tot = paidFull + partial + owedT || 1; const pct = Math.round((paidFull + partial) / tot * 100);
    const R = 42, C = 2 * Math.PI * R; let off = 0;
    const seg = (v, col) => { const len = v / tot * C; const s = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off += len; return v ? s : ''; };
    const byMethod = {}; S.payments.forEach(p => { byMethod[p.method || 'Other'] = (byMethod[p.method || 'Other'] || 0) + p.amountCents; });
    const donut = `<svg viewBox="0 0 120 120" style="max-width:130px" role="img" aria-label="${pct}% collected"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#26304A" stroke-width="16"/>${seg(paidFull, '#10B981')}${seg(partial, '#38BDF8')}${seg(owedT, '#E9C46A')}<text x="60" y="58" text-anchor="middle" fill="#F8FAFC" font-size="19" font-weight="700" font-family="JetBrains Mono, monospace">${pct}%</text><text x="60" y="74" text-anchor="middle" fill="#94A3B8" font-size="9">collected</text></svg>`;
    return `<section class="card chart-card">

      ${svg}
      <div class="legend" style="margin:6px 0 12px"><span><i style="background:#10B981"></i>Collected</span><span><i style="background:#E9C46A"></i>Owed</span></div>

        <div class="row" style="justify-content:space-between"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#38BDF8;margin-right:6px"></i>Part received</span><b class="num">${L.money(partial)}</b></div>
        <div class="row" style="justify-content:space-between"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#E9C46A;margin-right:6px"></i>Still owed</span><b class="num">${L.money(owedT)}</b></div>
        ${Object.keys(byMethod).length ? `<div class="faint tiny" style="margin-top:4px">${Object.entries(byMethod).map(([k, v]) => `${esc(k)}: ${L.money(v)}`).join(' · ')}</div>` : ''}
      </div></div></section>`;
  };

  const FILTERS = [['ALL', 'All'], ['UPCOMING', 'Upcoming'], ['OWED', 'To collect'], ['PARTIAL', 'Partial'], ['OVERDUE', 'Overdue'], ['CLASH', 'Clash / rest'], ['PAID', 'Paid'], ['CANCELLED', 'Cancelled']];
  const passFilter = s => {
    const st = info(s).st; const f = ui.filter;
    if (ui.q) { const q = ui.q.toLowerCase(); if (![s.siteName, conName(s), s.notes, s.supervisorName].join(' ').toLowerCase().includes(q)) return false; }
    if (f === 'ALL') return true;

    if (f === 'OWED') return st.ended && st.owed > 0 && !s.cancelled;
    if (f === 'PARTIAL') return st.code === 'PARTIAL';
    if (f === 'OVERDUE') return st.overdue;

    if (f === 'PAID') return st.code === 'PAID';

    return true;
  };
  const shiftList = () => {
    const list = S.shifts.filter(passFilter).sort((a, b) => {
      const up = ui.filter === 'UPCOMING'; const ka = a.date + a.start, kb = b.date + b.start; return up ? (ka < kb ? -1 : 1) : (ka > kb ? -1 : 1);

      }

    }
    return html;
  };
  const quick = () => `<div class="quick">
      <button data-act="go" data-tab="scan" class="primary"><i>${ICON.scan}</i><span>Add shift</span></button>
      <button data-act="lump"><i>${ICON.pay}</i><span>Got paid</span></button>
      <button data-act="newInvoice"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg></i><span>Invoice</span></button>

  const comingUp = () => {

  };

  const viewHome = () => `${greeting()}${nextShiftHero()}${quick()}${alerts()}${comingUp()}${moneyStrip()}

    S.contractors.filter(c => !c.archived || c.id === sel).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('') + (allowNew ? `<option value="__new" ${sel === '__new' ? 'selected' : ''}>+ New contractor…</option>` : '');
  const viewScan = () => `
    <div class="page-title"><h2>Add shifts</h2></div>
    <div class="method">
      <button class="${ui.scanMode === 'text' ? 'on' : ''}" data-act="scanMode" data-v="text">Paste / shared<br>message</button>
      <button class="${ui.scanMode === 'photo' ? 'on' : ''}" data-act="scanMode" data-v="photo">Roster<br>photo</button>
      <button data-act="newShift">Type it<br>myself</button>
    </div>
    ${ui.scanMode === 'photo' ? `<section class="card flat form">
      <div class="grid2"><label class="btn outline" for="photoCam">Take photo</label><label class="btn outline" for="photoIn">Choose screenshot</label></div>
      <input type="file" id="photoCam" accept="image/*" capture="environment" hidden><input type="file" id="photoIn" accept="image/*" hidden>
      <div id="ocrBox">${ui.ocr ? ocrBoxHtml() : '<p class="small muted" style="margin:0">The photo is sharpened, then read on this device. Handwriting and blurry photos read less well; you check everything before saving. Needs an internet connection the first time.</p>'}</div>
    </section>` : ''}
    <section class="card flat form">
      <label class="field"><span>Shift message${ui.scanMode === 'photo' ? ' (text read from photo)' : ''}</span>
        <textarea id="rawIn" placeholder="Paste the WhatsApp message here, e.g.&#10;Fri 13/11 Westfield Chermside&#10;6pm-2am $35/hr&#10;Call Raj 0412 345 678, pay Thursday">${esc(ui.raw)}</textarea></label>
      <label class="field"><span>Contractor (optional, helps fill rates and pay day)</span><select id="hintSel">${conOptions(ui.hint, false)}</select></label>
      <div class="row"><button class="btn outline grow" data-act="pasteClip">Paste &amp; read</button><button class="btn gold grow" data-act="parse">Read message</button></div>
      <div class="row" style="justify-content:space-between"><p class="tiny faint" style="margin:0">Tip: in WhatsApp, long-press the message, tap Copy, then Paste &amp; read. Or tap Share and pick GuardShift.</p><button class="btn sm ghost" data-act="sample">Try a sample</button></div>
    </section>
    ${ui.parsed.length ? '' : recentChips()}
    <div id="reviewArea" style="display:flex;flex-direction:column;gap:12px">${reviewHtml()}</div>`;
  const ocrBoxHtml = () => {
    const o = ui.ocr; if (!o) return '';
    if (o.state === 'busy') return `<div class="small">${esc(o.msg || 'Reading roster…')} ${Math.round(o.pct || 0)}%</div><div class="progress"><span style="width:${o.pct || 0}%"></span></div>`;
    if (o.state === 'error') return `<div class="warnbox warn">${esc(o.msg)}</div>`;
    if (o.state === 'done') return `<div class="warnbox ok">Text read from the photo. Check it below, then tap Read message.</div>`;
    return '';
  };
  const fieldCls = c => c === 'HIGH' ? 'ok' : c === 'CHECK' ? 'check' : c === 'MISSING' ? 'missing' : '';
  const why = f => f && f.reason ? `<span class="why">${esc(f.reason)}</span>` : '';
  const reviewHtml = () => {
    if (!ui.parsed.length) return ui.raw && ui._parsedOnce ? `<div class="card flat empty"><div class="big">No shift found</div>Add a date and a time like "Fri 13/11 6pm-2am", or tap Type it myself.</div>` : '';
    let html = `<div class="sec-title"><h2>Check ${ui.parsed.length} shift${ui.parsed.length > 1 ? 's' : ''}</h2><span class="small muted">green fine · amber check · red missing</span></div>`;
    ui.parsed.forEach((p, i) => {
      const f = p.fields; const v = p.edit;
      const cand = candFromEdit(v);
      const conf = cand.date && cand.start && cand.end ? L.checkCandidate(cand, S.shifts, { restHours: S.settings.restHours, longHours: S.settings.longHours }) : [];
      const dup = S.shifts.find(s => s.date === cand.date && s.start === cand.start && (s.contractorId === cand.contractorId || s.siteName === cand.siteName));
      const con = conOf(v.contractorId);
      const rate = L.rateFor(cand, con, S.holidays); const total = L.totalCents(cand, con, S.holidays);
      html += `<section class="card review form" data-i="${i}">
        <div class="review-head"><b>Shift ${i + 1} of ${ui.parsed.length}</b><button class="btn sm ghost" data-act="dropParsed" data-i="${i}">Remove</button></div>
        ${conflictBanner(conf)}
        ${dup ? `<div class="warnbox warn">${v.keepDup ? 'This is a copy of a shift you already saved. It will be saved again.' : `Already saved (${esc(L.fmtShort(dup.date))} ${esc(t(dup.start))}). It will be skipped. <button class="linkbtn" data-act="keepDup" data-i="${i}">Save a second copy</button>`}</div>` : ''}
        <label class="field ${fieldCls(f.contractor.conf)}"><span>Contractor</span><select data-k="contractorId">${conOptions(v.contractorId)}</select>${why(f.contractor)}</label>
        ${v.contractorId === '__new' ? `<label class="field"><span>New contractor name</span><input data-k="newCon" value="${esc(v.newCon || '')}" placeholder="Company name"></label>` : ''}
        <div class="grid2">
          <label class="field ${fieldCls(f.contact.conf)}"><span>Supervisor</span><input data-k="supervisorName" value="${esc(v.supervisorName)}"></label>
          <label class="field ${fieldCls(f.phone.conf)}"><span>Mobile</span><input data-k="supervisorPhone" inputmode="tel" value="${esc(v.supervisorPhone)}">${why(f.phone)}</label>

    box.innerHTML = `<div class="label">How it will be split</div><div class="list">${owedList.slice().sort((a, b) => (a.date + a.start) < (b.date + b.start) ? -1 : 1).map(o => { const s = S.shifts.find(x => x.id === o.id); const a = res.allocations.find(x => x.shiftId === o.id); const got = a ? a.amountCents : 0;

  };
  const viewPay = () => {

    const owed = sumOwed(S.shifts.filter(s => info(s).st.ended)); const overdue = sumOwed(S.shifts.filter(s => info(s).st.overdue));

      <div class="row pp-btns">${st.k !== 'paid' && owedNow > 0 ? `<button class="btn sm gold" data-act="batchPaid" data-k="${esc(b.key)}">Got paid ${L.money(owedNow)}</button>` : ''}
        ${st.k !== 'paid' && ended.length && !(iv && iv.all) ? `<button class="btn sm outline" data-act="batchInvoice" data-k="${esc(b.key)}">Invoice</button>` : ''}
        <button class="btn sm ghost" data-act="batchOpen" data-k="${esc(b.key)}">${open ? 'Hide shifts' : 'Shifts'}</button>
        ${st.k === 'late' && con.phone ? `<a class="btn sm outline" target="_blank" rel="noopener" href="https://wa.me/${L.waNumber(con.phone)}?text=${encodeURIComponent(batchReminder(b))}">Remind</a>` : ''}</div>

  const periodsView = () => {
    const all = batches(); const live = all.filter(b => batchState(b).k !== 'paid'); const done = all.filter(b => batchState(b).k === 'paid').reverse().slice(0, ui.morePaid ? 50 : 4);
    const noRule = S.contractors.filter(c => !c.archived && S.shifts.some(s => s.contractorId === c.id) && !(c.payRule && c.payRule.type));

      <p class="tiny faint" style="text-align:center">GuardShift Royale · data kept on this device only</p>`;
  };
  const csvText = () => {

      ${fys.length ? fys.map(fy => { const rows = Object.values(m).filter(x => x.fy === fy); const tot = rows.reduce((a, x) => ({ min: a.min + x.min, gross: a.gross + x.gross, paid: a.paid + x.paid }), { min: 0, gross: 0, paid: 0 });
        return `<section class="card flat" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>FY ${esc(fy)}</b><b class="num c-gold">${L.money(tot.gross)}</b></div><div class="list">${rows.map(x => `<div class="li"><div class="grow"><div class="t">${esc(x.con)}</div><div class="small muted num">${L.fmtHours(x.min)} · received ${L.money(x.paid)}</div></div><b class="num">${L.money(x.gross)}</b></div>`).join('')}</div><div class="small muted">Total ${L.fmtHours(tot.min)} · received ${L.money(tot.paid)} · still owed ${L.money(tot.gross - tot.paid)}</div></section>`; }).join('') : '<div class="card flat empty">No finished shifts yet.</div>'}
      <div class="sticky-actions"><button class="btn" data-act="closeModal">Close</button></div>`);
  };
  const restorePreview = text => {
    let data; try { data = JSON.parse(text); } catch (e) { toast('That is not a GuardShift backup.'); return; }
