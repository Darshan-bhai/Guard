        <div class="list">${S.holidays.filter(h => h.date >= L.addDays(today(), -30)).sort((a, b) => a.date < b.date ? -1 : 1).slice(0, 12).map(h => `<div class="li"><div class="grow"><span class="num">${esc(L.fmtDate(h.date))}</span> <span class="small muted">${esc(h.name)}</span></div><button class="btn sm ghost" data-act="holDel" data-d="${h.date}">Remove</button></div>`).join('')}</div>
        <div class="grid2" style="margin-top:8px"><label class="field"><span>Date</span><input type="date" id="hol_d"></label><label class="field"><span>Name</span><input id="hol_n" placeholder="e.g. Show day"></label></div>
        <button class="btn outline block" data-act="holAdd" style="margin-top:8px">Add holiday</button></section>
      <section class="card flat"><div class="label c-gold">Demo &amp; reset</div>
        <div class="row" style="padding-top:10px">${hasDemo() ? '<button class="btn outline grow" data-act="askClearDemo">Clear demo data</button>' : '<button class="btn outline grow" data-act="loadDemo">Load demo data</button>'}<button class="btn danger grow" data-act="wipe">Delete all my data</button></div></section>
      <p class="tiny faint" style="text-align:center">GuardShift Royale · data kept on this device only</p>`;
  };
  const csvText = () => {
    const rows = [['Date', 'Contractor', 'Site', 'Start', 'End', 'Break min', 'Hours', 'Rate type', 'Rate', 'Total', 'Paid', 'Owed', 'Status', 'Pay date', 'Method', 'Notes']];
    S.shifts.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(s => { const { st, rate, min } = info(s); rows.push([s.date, conName(s), s.siteName, s.actualStart || s.start, s.actualEnd || s.end, s.breakMin, (min / 60).toFixed(2), rate.type, (rate.cents / 100).toFixed(2), (st.total / 100).toFixed(2), (st.paid / 100).toFixed(2), (st.owed / 100).toFixed(2), st.code, s.payDate, s.method, s.notes]); });
    return L.csv(rows);
  };
  const fySummary = () => {
    const m = {}; S.shifts.filter(s => !s.cancelled && info(s).st.ended).forEach(s => { const fy = L.fyOf(s.date); const k = fy + '|' + conName(s); const { st } = info(s); m[k] = m[k] || { fy, con: conName(s), min: 0, gross: 0, paid: 0 }; m[k].min += L.netMinutes(s); m[k].gross += st.total; m[k].paid += Math.min(st.paid, st.total); });
    const fys = [...new Set(Object.values(m).map(x => x.fy))].sort().reverse();
    openModal(`<div class="modal-head"><h3>Financial year summary</h3><button class="btn icon ghost" data-act="closeModal" aria-label="Close">✕</button></div>
      <p class="small muted" style="margin-top:-6px">1 July to 30 June, by contractor. Records only, not tax advice.</p>
      ${fys.length ? fys.map(fy => { const rows = Object.values(m).filter(x => x.fy === fy); const tot = rows.reduce((a, x) => ({ min: a.min + x.min, gross: a.gross + x.gross, paid: a.paid + x.paid }), { min: 0, gross: 0, paid: 0 });
        return `<section class="card flat" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>FY ${esc(fy)}</b><b class="num c-gold">${L.money(tot.gross)}</b></div><div class="list">${rows.map(x => `<div class="li"><div class="grow"><div class="t">${esc(x.con)}</div><div class="small muted num">${L.fmtHours(x.min)} · received ${L.money(x.paid)}</div></div><b class="num">${L.money(x.gross)}</b></div>`).join('')}</div><div class="small muted">Total ${L.fmtHours(tot.min)} · received ${L.money(tot.paid)} · still owed ${L.money(tot.gross - tot.paid)}</div></section>`; }).join('') : '<div class="card flat empty">No finished shifts yet.</div>'}
      <div class="sticky-actions"><button class="btn" data-act="closeModal">Close</button></div>`);
  };
  const restorePreview = text => {
    let data; try { data = JSON.parse(text); } catch (e) { toast('That is not a GuardShift backup.'); return; }
    if (!data || !Array.isArray(data.shifts) || !Array.isArray(data.contractors)) { toast('That is not a GuardShift backup.'); return; }
    ui.restore = data;
    openModal(`<h3>Restore backup</h3><p class="muted">This backup has <b>${data.shifts.length}</b> shifts, <b>${data.contractors.length}</b> contractors, <b>${(data.payments || []).length}</b> payments, <b>${(data.invoices || []).length}</b> invoices <b>${(data.licences || []).length}</b> licences and documents, and <b>${(data.files || []).length}</b> document files${data.exportedAt ? ', saved ' + esc(L.fmtDate(data.exportedAt.slice(0, 10))) : ''}.</p>
      <p class="small muted"><b>Merge</b> adds anything missing and updates matching records. <b>Replace</b> swaps everything on this device for the backup.</p>
      <div class="sticky-actions"><button class="btn" data-act="closeModal">Cancel</button><button class="btn outline" data-act="restoreDo" data-v="merge">Merge</button><button class="btn danger" data-act="restoreDo" data-v="replace">Replace</button></div>`);
  };
  const restoreDo = mode => {
    const d = ui.restore; if (!d) return; const base = blank();
    if (mode === 'replace') { S = Object.assign(base, d); S.settings = Object.assign(base.settings, d.settings || {}); S.profile = Object.assign(base.profile, d.profile || {}); }
    else {
      ['contractors', 'shifts', 'payments', 'invoices', 'licences'].forEach(k => { (d[k] || []).forEach(x => { const i = S[k].findIndex(y => y.id === x.id); if (i >= 0) S[k][i] = x; else S[k].push(x); }); });
      (d.holidays || []).forEach(h => { if (!S.holidays.some(x => x.date === h.date)) S.holidays.push(h); });
      if (!S.profile.fullName && d.profile) S.profile = Object.assign(base.profile, d.profile);
    }
    for (const f of (d.files || [])) { try { const bin = atob(f.data); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      DB.filePut({ id: f.id, name: f.name, type: f.type, size: f.size, w: f.w, h: f.h, addedAt: f.addedAt, blob: new Blob([u], { type: f.type }) }); fileMeta[f.id] = { name: f.name, type: f.type, size: f.size, w: f.w, h: f.h }; } catch (e) { } }
    delete S.files;
    ui.restore = null; save(); closeModal(); render(); toast('Backup restored');
  };
  const backupJSON = () => { S.settings.lastBackup = new Date().toISOString(); save(); return JSON.stringify(Object.assign({}, S, { exportedAt: new Date().toISOString(), settings: Object.assign({}, S.settings, { pinHash: null, bioId: null }) }), null, 1); };

  // PIN
  const hashPin = async pin => {
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('gsr:' + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let h = 5381; for (const c of 'gsr:' + pin) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'd' + h.toString(16); }
  };
  // ---- fingerprint / face unlock (WebAuthn platform authenticator; works in the installed app over https) ----
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  const bioCheck = async () => {
    try { ui.bioOK = !!(window.PublicKeyCredential && window.isSecureContext && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
    catch (e) { ui.bioOK = false; }
  };
  const bioOn = async () => {
    try {
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'GuardShift Royale' },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'guardshift-user', displayName: S.profile.fullName || 'GuardShift user' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
        timeout: 60000, attestation: 'none' } });
      if (!cred) throw new Error('none');
      S.settings.bioId = b64(cred.rawId); save(); render(); toast('Fingerprint unlock is on');
    } catch (e) { toast(e && e.name === 'NotAllowedError' ? 'Fingerprint setup was cancelled.' : 'Fingerprint could not be set up on this device.'); }
  };
  let bioBusy = false;
  const bioUnlock = async () => {
    if (!S.settings.bioId || bioBusy) return; bioBusy = true;
    try {
      const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), timeout: 60000,
        allowCredentials: [{ type: 'public-key', id: unb64(S.settings.bioId), transports: ['internal'] }], userVerification: 'required' } });
      if (a && b64(a.rawId) === S.settings.bioId && a.response && a.response.authenticatorData) {
        const flags = new Uint8Array(a.response.authenticatorData)[32];
        if (flags & 0x04) { $('#lock').hidden = true; lastHidden = null; bioBusy = false; return; } // UV flag: fingerprint/face confirmed
      }
      const er = $('#pinErr'); if (er) er.textContent = 'Fingerprint not confirmed. Use your PIN.';
    } catch (e) { const er = $('#pinErr'); if (er) er.textContent = 'Use your PIN, or tap the fingerprint button to try again.'; }
    bioBusy = false;
  };

  let pinBuf = '', pinMode = null, pinFirst = '';
  const showLock = (mode) => {
    pinMode = mode; pinBuf = ''; const el = $('#lock'); el.hidden = false;
    const title = mode === 'unlock' ? 'Enter your PIN' : mode === 'set1' ? 'Choose a 4-6 digit PIN' : 'Enter it again';
    el.innerHTML = `<div class="emblem" style="width:56px;height:56px">${ICON.shield}</div><h2 class="gold-text">GUARDSHIFT ROYALE</h2><div class="muted">${title}</div>
      <div class="pin-dots" id="pinDots"></div><div class="small c-danger" id="pinErr" style="min-height:18px"></div>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-pin="${n}">${n}</button>`).join('')}<button data-pin="del" aria-label="Delete">⌫</button><button data-pin="0">0</button><button data-pin="ok" style="font-size:15px;font-family:var(--f-body)">OK</button></div>
      ${mode !== 'unlock' ? '<button class="btn ghost" data-pin="cancel">Cancel</button>' : ''}
      ${mode === 'unlock' && S.settings.bioId ? `<button class="btn outline" data-pin="bio" style="gap:10px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 11v4M8.5 7.5A5 5 0 0 1 17 11v2.5M7 11a5 5 0 0 1 .4-2M7 14c0 2 .5 3.5 1.5 5M10 11a2 2 0 0 1 4 0v3c0 2.5.6 4 1.5 5.5M17 16.5c0 1 .2 2 .5 2.8M5 8a8.5 8.5 0 0 1 14 1.5"/></svg>Use fingerprint</button>` : ''}`;
    paintDots();
    if (mode === 'unlock' && S.settings.bioId) setTimeout(bioUnlock, 300);
  };
  const paintDots = () => { const d = $('#pinDots'); if (d) d.innerHTML = Array.from({ length: Math.max(4, pinBuf.length) }, (_, i) => `<i class="${i < pinBuf.length ? 'f' : ''}"></i>`).join(''); };
  const pinKey = async k => {
    if (k === 'cancel') { $('#lock').hidden = true; return; }
    if (k === 'bio') { bioUnlock(); return; }
    if (k === 'del') { pinBuf = pinBuf.slice(0, -1); paintDots(); return; }
    if (k !== 'ok') { if (pinBuf.length < 6) pinBuf += k; paintDots(); if (!(pinMode === 'unlock' && pinBuf.length >= 4)) return; if (pinMode === 'unlock') { const h = await hashPin(pinBuf); if (h === S.settings.pinHash) { $('#lock').hidden = true; lastHidden = null; } else if (pinBuf.length === 6) { $('#pinErr').textContent = 'Wrong PIN'; pinBuf = ''; paintDots(); } } return; }
    if (pinBuf.length < 4) { $('#pinErr').textContent = 'Use 4 to 6 digits'; return; }
    if (pinMode === 'unlock') { const h = await hashPin(pinBuf); if (h === S.settings.pinHash) { $('#lock').hidden = true; } else { $('#pinErr').textContent = 'Wrong PIN'; pinBuf = ''; paintDots(); } }
    else if (pinMode === 'set1') { pinFirst = pinBuf; showLock('set2'); }
    else if (pinMode === 'set2') { if (pinBuf !== pinFirst) { pinFirst = ''; showLock('set1'); $('#pinErr').textContent = 'PINs did not match. Try again.'; return; } S.settings.pinHash = await hashPin(pinBuf); save(); $('#lock').hidden = true; render(); toast('PIN set'); }
  };
  let lastHidden = null;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) lastHidden = Date.now();
    else if (S.settings.pinHash && lastHidden && Date.now() - lastHidden > 120000) showLock('unlock');
  });

  // notifications while open
  const checkNotify = () => {
    if (!S.settings.notifyOpen || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const now = new Date(); const n = S.settings.notified || (S.settings.notified = {});
    S.shifts.forEach(s => { if (s.cancelled) return; const sp = L.shiftSpan(s, true); if (!sp) return; const diff = (sp.start - now) / 60000;
      const key = 'sh' + s.id; if (diff > 0 && diff <= S.settings.remindMin && !n[key]) { n[key] = 1; try { new Notification('Shift soon: ' + (s.siteName || ''), { body: `${conName(s)} · starts ${t(s.start)}` }); } catch (e) { } save(); } });
    if (now.getHours() >= 9) { const td = today(); const due = S.shifts.filter(s => s.payDate === td && info(s).st.owed > 0); const key = 'pay' + td;
      if (due.length && !n[key]) { n[key] = 1; try { new Notification('Pay day', { body: `Collect ${L.money(sumOwed(due))} today` }); } catch (e) { } save(); } }
  };

  // ================= RENDER =================
  const render = () => {
    recomputeConflicts();
    const v = $('#view');
    v.innerHTML = ui.tab === 'home' ? viewHome() : ui.tab === 'scan' ? viewScan() : ui.tab === 'calendar' ? viewCalendar() : ui.tab === 'pay' ? viewPay() : ui.tab === 'docs' ? viewDocs() : viewMore();
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
    $('#fab').hidden = !(ui.tab === 'home' || ui.tab === 'calendar');
    if (ui.tab === 'docs' || ui.sub === 'licences') paintThumbs();
    if (ui.tab === 'more' && ui.sub === 'settings') {
      const pi = $('#persistInfo');
      if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { pi.textContent = p ? 'Protected: your browser will not clear it automatically.' : 'Not protected yet. Install the app to your home screen and back up regularly.'; }).catch(() => { pi.textContent = 'Back up regularly.'; });
      else pi.textContent = 'Back up regularly.';
    }
  };
  const go = (tab, sub) => { ui.tab = tab; ui.sub = sub || null; render(); window.scrollTo(0, 0); };

  // ================= EVENTS =================
  const A = {
    go: el => go(el.dataset.tab, el.dataset.sub),
    modalBack: (el, e) => { if (e.target === el) closeModal(); },
    closeModal: () => closeModal(),
    confirmOk: () => { const f = confirmFn; confirmFn = null; closeModal(); f && f(); },
    copy: el => copyText(el.dataset.text),
    filter: el => { ui.filter = el.dataset.v; if (ui.tab !== 'home') ui.tab = 'home'; render(); if (el.closest('.alerts') || el.classList.contains('kpi')) setTimeout(() => $('#shiftList') && $('#shiftList').scrollIntoView({ behavior: 'smooth' }), 50); },
    chart: el => { ui.chart = el.dataset.v; render(); },
    askClearDemo: () => confirmBox('Clear demo data?', 'Removes the made-up contractors, shifts, payments and licences. Anything you added yourself stays.', 'Clear demo data', () => withUndo('Demo data cleared', clearDemo)),
    loadDemo: async () => { loadDemo(); await addDemoFiles(); save(); go('home'); toast('Demo data loaded'); },
    newShift: () => shiftForm(null),
    newShiftOn: el => { shiftForm(null); $('#sf_date').value = el.dataset.d; sfLive(); },
    editShift: el => shiftForm(S.shifts.find(s => s.id === el.dataset.id)),
    shiftMenu: el => { const id = el.dataset.id; const s = S.shifts.find(x => x.id === id);
      openModal(`<h3>${esc(s.siteName || 'Shift')} · ${esc(L.fmtShort(s.date))}</h3><div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" data-act="editShift" data-id="${id}">Edit shift</button>
        <button class="btn" data-act="dupShift" data-id="${id}" data-n="1">Duplicate (same time next week)</button>
        <button class="btn" data-act="dupShift" data-id="${id}" data-n="4">Repeat weekly for 4 weeks</button>
        ${s.supervisorPhone ? `<a class="btn" href="tel:${esc(s.supervisorPhone.replace(/\s/g, ''))}">Call ${esc(s.supervisorName || '')} <span class="num">${esc(s.supervisorPhone)}</span></a>` : ''}
        <button class="btn" data-act="cancelShift" data-id="${id}">${s.cancelled ? 'Restore shift' : 'Mark as cancelled'}</button>
        <button class="btn danger" data-act="delShift" data-id="${id}">Delete shift</button>
        <button class="btn ghost" data-act="closeModal">Close</button></div>`); },
    dupShift: el => { const s = S.shifts.find(x => x.id === el.dataset.id); const n = +el.dataset.n; closeModal();
      withUndo(n > 1 ? `Added ${n} weekly shifts` : 'Shift duplicated', () => { for (let i = 1; i <= n; i++) { const c = JSON.parse(JSON.stringify(s)); Object.assign(c, { id: L.uid(), date: L.addDays(s.date, 7 * i), actualStart: null, actualEnd: null, cancelled: false, invoiceId: null, isDemo: false, createdAt: new Date().toISOString() }); const con = conOf(c.contractorId); c.payDate = con ? L.payDateFrom(L.endDate(c), con.payRule) : (s.payDate ? L.addDays(s.payDate, 7 * i) : ''); S.shifts.push(c); } }); },
    cancelShift: el => { const s = S.shifts.find(x => x.id === el.dataset.id); closeModal(); withUndo(s.cancelled ? 'Shift restored' : 'Shift cancelled', () => { s.cancelled = !s.cancelled; }); },
    delShift: el => { const id = el.dataset.id; closeModal(); withUndo('Shift deleted', () => { S.shifts = S.shifts.filter(s => s.id !== id); S.payments.forEach(p => { p.allocations = (p.allocations || []).filter(a => a.shiftId !== id); }); S.payments = S.payments.filter(p => p.allocations.length); }); },
    startShift: el => { const s = S.shifts.find(x => x.id === el.dataset.id); const n = new Date(); s.actualStart = `${L.pad(n.getHours())}:${L.pad(n.getMinutes())}`; if (L.ymd(n) !== s.date && n.getHours() > 12) s.date = L.ymd(n); save(); render(); toast('Shift started ' + t(s.actualStart)); },
    endShift: el => { const s = S.shifts.find(x => x.id === el.dataset.id); const n = new Date(); s.actualEnd = `${L.pad(n.getHours())}:${L.pad(n.getMinutes())}`; save(); render(); toast(`Shift ended · ${L.fmtHours(L.netMinutes(s))} worked`); },
    saveShift: () => saveShift(),
    sfRule: () => { const f = sfRead(); const c = conOf(f.contractorId); if (!c) { toast('Choose a contractor first.'); return; } $('#sf_pay').value = L.payDateFrom(L.endDate(f), c.payRule) || ''; sfLive(); },
    payShift: el => payShiftModal(el.dataset.id),
    payPreset: el => { const cur = L.toCents($('#pm_amt').value); const v = +el.dataset.v; $('#pm_amt').value = L.centsToInput(el.textContent.includes('full') ? v : v); },
    savePayShift: el => savePayShift(el.dataset.id),
    togglePaid: el => togglePaid(el.dataset.id),
    delPayment: el => { const id = el.dataset.id; closeModal(); withUndo('Payment deleted', () => { S.payments = S.payments.filter(p => p.id !== id); }); },
    lump: el => lumpModal(el.dataset.id || ''),
    saveLump: () => saveLump(),
    payView: el => { ui.payView = el.dataset.v; render(); },
    scanMode: el => { ui.raw = ($('#rawIn') || {}).value || ui.raw; ui.scanMode = el.dataset.v; render(); },
    parse: () => doParse(),
    sample: () => { ui.raw = 'Hi team, shifts this week:\nFri ' + L.fmtShort(L.addDays(today(), (5 - new Date().getDay() + 7) % 7 || 7)).slice(4) + ' Westfield Chermside\n6pm-2am  $35/hr\nSat ' + L.fmtShort(L.addDays(today(), (6 - new Date().getDay() + 7) % 7 || 7)).slice(4) + ' Suncorp 4-12\nContact Raj 0412 345 678\nPay Thursday after the shift'; render(); doParse(); },
    dropParsed: el => { ui.parsed.splice(+el.dataset.i, 1); $('#reviewArea').innerHTML = reviewHtml(); },
    discardParsed: () => { ui.parsed = []; ui._parsedOnce = false; $('#reviewArea').innerHTML = ''; },
    saveParsed: () => saveParsed(),
    calNav: el => { const d = L.parseYMD(ui.calMonth); d.setMonth(d.getMonth() + +el.dataset.v); d.setDate(1); ui.calMonth = L.ymd(d); render(); },
    calSel: el => { ui.calSel = el.dataset.d; render(); },
    ics: () => { const { ics, n } = buildIcs(); if (!n) { toast('No upcoming shifts or pay days to export.'); return; } saveFile('GuardShift_calendar.ics', 'text/calendar', ics); },
    licForm: el => licForm(el.dataset.id), licSave: el => licSave(el.dataset.id), licRenew: el => licRenew(el.dataset.id),
    licRenewSave: async el => { const l = S.licences.find(x => x.id === el.dataset.id); const v = $('#lr_e').value; if (!v) return; const fl = [...($('#lr_files').files || [])]; const repl = $('#lr_replace').checked;
      l.expiry = v; closeModal(); if (fl.length) { const old = (l.files || []).slice(); const n = await addFilesTo(l.id, fl); if (n && repl) { l.files = l.files.filter(id => !old.includes(id)); deleteFileIds(old); } }
      save(); render(); toast('Expiry updated to ' + L.fmtDate(v)); },
    licDel: el => { const l = S.licences.find(x => x.id === el.dataset.id); const n = (l.files || []).length;
      confirmBox('Delete ' + l.title + '?', n ? `This also deletes its ${n} file${n > 1 ? 's' : ''} from this phone.` : 'This cannot be undone.', 'Delete', () => { deleteFileIds(l.files || []); S.licences = S.licences.filter(x => x.id !== l.id); ui.docSel && ui.docSel.delete(l.id); save(); render(); toast('Deleted'); }, true); },
    addFile: el => { ui.fileTarget = el.dataset.id; const i = $('#docFileIn'); i.value = ''; i.click(); },
    docStar: el => { const l = S.licences.find(x => x.id === el.dataset.id); l.inPack = !l.inPack; save(); render(); toast(l.inPack ? 'Added to your pack' : 'Removed from your pack'); },
    shareDoc: el => shareDocs([el.dataset.id], false),
    sharePack: () => { const ids = S.licences.filter(l => l.inPack && docFiles(l).length).map(l => l.id); shareDocs(ids, false); },
    shareSel: () => shareDocs([...ui.docSel], false),
    shareSelPdf: () => shareDocs([...ui.docSel], true),
    clearSel: () => { ui.docSel.clear(); render(); },
    viewFile: el => viewFile(el.dataset.doc, el.dataset.file),
    shareFile: async el => { const f = await DB.fileGet(el.dataset.file); if (!f) return; const file = new File([f.blob], f.name, { type: f.type });
      try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: f.name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      saveFile(f.name, f.type, f.blob); },
    dlFile: async el => { const f = await DB.fileGet(el.dataset.file); if (f) saveFile(f.name, f.type, f.blob); },
    delFile: el => { const l = S.licences.find(x => x.id === el.dataset.doc); const fid = el.dataset.file; l.files = (l.files || []).filter(x => x !== fid); deleteFileIds([fid]); save(); closeModal(); render(); toast('File deleted'); },
    conForm: el => conForm(el.dataset.id), conSave: el => conSave(el.dataset.id),
    conDel: el => { const c = conOf(el.dataset.id); if (S.shifts.some(s => s.contractorId === c.id)) withUndo(c.archived ? 'Restored' : 'Archived (history kept)', () => { c.archived = !c.archived; }); else withUndo('Contractor deleted', () => { S.contractors = S.contractors.filter(x => x.id !== c.id); }); },
    newInvoice: el => invoiceModal(el.dataset.id),
    ivScope: el => { ivRead(); ui.invDraft.scope = el.dataset.v; ui.invDraft.picked = null; paintInvoiceModal(); },
    ivCopy: () => { ivRead(); copyText(invText(buildInv(ui.invDraft)), 'Invoice text copied'); },
    ivSave: () => { ivRead(); const inv = buildInv(ui.invDraft); if (!inv.lines.length) return; if (S.invoices.some(i => i.number === inv.number)) { toast('That invoice number is already used.'); return; }
      inv.id = L.uid(); inv.status = 'SENT'; S.invoices.push(inv); inv.shiftIds.forEach(id => { const s = S.shifts.find(x => x.id === id); if (s) s.invoiceId = inv.id; });
      const m = /(\d+)$/.exec(inv.number); if (m) S.profile.nextInvoiceSeq = Math.max(S.profile.nextInvoiceSeq || 1, +m[1] + 1);
      save(); render(); invoiceView(inv.id); toast('Invoice ' + inv.number + ' saved'); },
    viewInvoice: el => invoiceView(el.dataset.id),
    ivPrint: el => printInvoice(S.invoices.find(i => i.id === el.dataset.id)),
    ivCopyId: el => copyText(invText(S.invoices.find(i => i.id === el.dataset.id)), 'Invoice text copied'),
    ivDel: el => { const id = el.dataset.id; closeModal(); withUndo('Invoice deleted', () => { S.invoices = S.invoices.filter(i => i.id !== id); S.shifts.forEach(s => { if (s.invoiceId === id) s.invoiceId = null; }); }); },
    saveProfile: () => { const g = k => $('#' + k).value.trim(); Object.assign(S.profile, { fullName: g('pf_name'), tradingName: g('pf_trade'), abn: g('pf_abn'), licenceNo: g('pf_lic'), email: g('pf_email'), phone: g('pf_phone'), bankName: g('pf_bank'), accountName: g('pf_accn'), bsb: g('pf_bsb'), accountNumber: g('pf_acc'), gstRegistered: $('#pf_gst').checked }); save(); render(); toast('Details saved'); },
    saveSettings: () => { const st = S.settings; st.restHours = Math.max(0, parseFloat($('#st_rest').value) || 8); st.longHours = Math.max(1, parseFloat($('#st_long').value) || 12); st.weekHours = Math.max(1, parseFloat($('#st_week').value) || 50);
      st.remindMin = +$('#st_rem').value; st.clock24 = $('#st_clock').value === '24'; st.includeBank = $('#st_bank').checked;
      const wantN = $('#st_notify').checked;
      if (wantN && typeof Notification !== 'undefined' && Notification.permission !== 'granted') { try { Notification.requestPermission().then(p => { st.notifyOpen = p === 'granted'; save(); if (p !== 'granted') toast('Notifications were not allowed.'); }); } catch (e) { st.notifyOpen = false; } }
      else st.notifyOpen = wantN && typeof Notification !== 'undefined';
      save(); render(); toast('Settings saved'); },
    backup: async () => { const json = JSON.parse(backupJSON()); const all = await DB.fileAll(); const out = [];
      for (const f of all) { const buf = new Uint8Array(await f.blob.arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
        out.push({ id: f.id, name: f.name, type: f.type, size: f.size, w: f.w, h: f.h, addedAt: f.addedAt, data: btoa(bin) }); }
      json.files = out; saveFile(`GuardShift_backup_${today()}.json`, 'application/json', JSON.stringify(json)); },
    backupCopy: () => copyText(backupJSON(), 'Backup copied. Paste it into a note or email to yourself.'),
    restoreText: () => restorePreview($('#restoreText').value),
    restoreDo: el => restoreDo(el.dataset.v),
    csv: () => saveFile(`GuardShift_Ledger_${today()}.csv`, 'text/csv', csvText()),
    csvCopy: () => copyText(csvText(), 'CSV copied'),
    fy: () => fySummary(),
    holDel: el => { const d = el.dataset.d; withUndo('Holiday removed', () => { S.holidays = S.holidays.filter(h => h.date !== d); }); },
    holAdd: () => { const d = $('#hol_d').value; if (!d) { toast('Pick a date.'); return; } S.holidays.push({ date: d, name: $('#hol_n').value.trim() || 'Public holiday' }); save(); render(); toast('Holiday added'); },
    wipe: () => { openModal(`<h3>Delete all data?</h3><p class="muted">Everything on this device is removed: shifts, payments, invoices, contractors, licences and your details. Download a backup first if you might need it. Type <b>DELETE</b> to confirm.</p><label class="field"><span>Type DELETE</span><input id="wipeTxt" autocomplete="off"></label><div class="sticky-actions"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="wipeDo">Delete everything</button></div>`); },
    wipeDo: () => { if ($('#wipeTxt').value.trim() !== 'DELETE') { toast('Type DELETE to confirm.'); return; } S = blank(); S.settings.onboarded = true; DB.fileClear(); save(); closeModal(); go('home'); toast('All data deleted'); },
    pinSet: () => showLock('set1'),
    bioOn: () => bioOn(),
    bioOff: () => { S.settings.bioId = null; save(); render(); toast('Fingerprint unlock is off'); },
    pinRemove: () => confirmBox('Remove PIN?', 'Anyone with your phone will be able to open the app.', 'Remove PIN', () => { S.settings.pinHash = null; S.settings.bioId = null; save(); render(); toast('PIN removed'); }, true)
  };
  document.addEventListener('click', e => {
    const pin = e.target.closest('[data-pin]'); if (pin) { pinKey(pin.dataset.pin); return; }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const fn = A[el.dataset.act]; if (fn) { if (el.dataset.act !== 'modalBack') e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'searchBox') { ui.q = el.value; const l = $('#shiftList'); if (l) { recomputeConflicts(); l.innerHTML = shiftList(); } return; }
    if (el.id === 'rawIn') { ui.raw = el.value; return; }
    if (el.closest && el.closest('#sf')) { sfLive(); return; }
    if (el.id && el.id.startsWith('lp_')) { lumpPrev(); return; }
    const card = el.closest && el.closest('.review'); if (card && el.dataset.k) { const p = ui.parsed[+card.dataset.i]; p.edit[el.dataset.k] = el.value; if (el.dataset.k === 'contractorId' || el.dataset.k === 'rateType') { const c = conOf(p.edit.contractorId); if (el.dataset.k === 'contractorId' && c) { p.edit.method = c.defaultMethod || p.edit.method; if (!p.edit.supervisorPhone) p.edit.supervisorPhone = c.phone || ''; if (!p.edit.supervisorName) p.edit.supervisorName = c.contactName || ''; if (p.edit.date && p.edit.start && p.edit.end && !p.edit.payRuleFromMsg) p.edit.payDate = L.payDateFrom(L.endDate(candFromEdit(p.edit)), c.payRule) || p.edit.payDate; } } }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'photoIn' && el.files && el.files[0]) { runOCR(el.files[0]); return; }
    if (el.id === 'restoreFile' && el.files && el.files[0]) { const r = new FileReader(); r.onload = () => restorePreview(String(r.result)); r.readAsText(el.files[0]); return; }
    if (el.id === 'cf_pt') { cfRuleBox({}); return; }
    if (el.dataset && el.dataset.docPick) { el.checked ? ui.docSel.add(el.dataset.docPick) : ui.docSel.delete(el.dataset.docPick); render(); return; }
    if (el.id === 'docFileIn' && el.files && el.files.length) { const id = ui.fileTarget; const fl = [...el.files]; addFilesTo(id, fl).then(n => { render(); if (n) toast(`Added ${n} file${n > 1 ? 's' : ''}`); }); return; }
    if (el.id === 'lf_noexp') { $('#lf_eBox').hidden = el.checked; return; }
    if (el.dataset && el.dataset.ivPick) { ivRead(); const d = ui.invDraft; const cands = invCandidates(d); const picked = new Set(d.picked || cands.map(s => s.id)); el.checked ? picked.add(el.dataset.ivPick) : picked.delete(el.dataset.ivPick); d.picked = [...picked]; paintInvoiceModal(); return; }
    if (el.id === 'iv_con' || el.id === 'iv_from' || el.id === 'iv_to' || el.id === 'iv_iss') { ivRead(); paintInvoiceModal(); return; }
    const card = el.closest && el.closest('.review'); if (card && el.dataset.k) { const ra = $('#reviewArea'); const y = window.scrollY; ra.innerHTML = reviewHtml(); window.scrollTo(0, y); return; }
    if (el.closest && el.closest('#sf') && el.id === 'sf_con') { const c = conOf(el.value); if (c) { if (!$('#sf_ph').value) $('#sf_ph').value = c.phone || ''; if (!$('#sf_sup').value) $('#sf_sup').value = c.contactName || ''; $('#sf_m').value = c.defaultMethod || METHODS[0]; } sfLive(); }
    if (el.id === 'sf_rt') { const r = $('#sf_rate'); if (el.value === 'CUSTOM' || el.value === 'FLAT') { r.value = ''; r.focus(); } sfLive(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modalRoot').hidden) closeModal(); });

  // ================= START =================
  (async () => {
    $('#nav').innerHTML = `<div class="wrap">${[['home', 'Home'], ['scan', 'Scan'], ['calendar', 'Calendar'], ['pay', 'Pay'], ['docs', 'Docs'], ['more', 'More']].map(([k, l]) => `<button data-act="go" data-tab="${k}" aria-label="${l}">${ICON[k]}<span>${l}</span></button>`).join('')}</div>`;
    $('#emblem').innerHTML = ICON.shield;
    await DB.open();
    await bioCheck();
    const saved = await DB.get('state');
    if (saved && saved.shifts) { const b = blank(); S = Object.assign(b, saved); S.settings = Object.assign(b.settings, saved.settings || {}); S.profile = Object.assign(b.profile, saved.profile || {}); }
    else { loadDemo(); S.settings.onboarded = true; await addDemoFiles(); save(); }
    await loadFileMeta();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    render();
    if (S.settings.pinHash) showLock('unlock');
    setInterval(() => { checkNotify(); if (ui.tab === 'home' && $('#modalRoot').hidden && document.activeElement && document.activeElement.id !== 'searchBox') render(); }, 60000);
    checkNotify();
  })();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script></body></html>
